# Single-node Loki for the agent-rag containers' stdout logs.
#
# Started with `-config.expand-env=true`, so ${LOKI_RETENTION:-720h} is read
# from the container environment (set it in .env). Everything is stored under
# /loki, which is backed by the gitignored volumes-monitoring/ directory.
#
# Grafana queries it through the provisioned "Loki" datasource (uid `loki`);
# Promtail pushes from the same `agent-rag-monitoring` network.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION:-720h}
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
