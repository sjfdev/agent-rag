name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must not touch the network: fake embeddings, no LLM, no HF downloads.
  EMBEDDING_BACKEND: fake
  VECTOR_STORE_TYPE: faiss
  HF_HUB_OFFLINE: "1"
  HF_ENDPOINT: https://hf-mirror.com
  PYTHONUNBUFFERED: "1"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      # Same pins as local runs. requirements-test.txt omits torch and
      # sentence-transformers because CI uses fake embeddings and a stubbed LLM.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts main.py run_ingestion.py test_agent.py

      - name: Tests
        run: pytest -q --cov=src --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore
