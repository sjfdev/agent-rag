name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must not touch the network: fake embeddings, no LLM, no HF downloads.
  EMBEDDING_BACKEND: fake
  VECTOR_STORE_TYPE: faiss
  HF_HUB_OFFLINE: "1"
  HF_ENDPOINT: https://hf-mirror.com
  PYTHONUNBUFFERED: "1"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Install only what the tests need. Deployment still uses the full pin set
      # in requirements.txt; CI runs against fake embeddings and a stubbed LLM.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pytest==8.3.4" "pytest-cov==6.0.0" \
            "numpy==1.26.4" \
            "fastapi==0.162.0" "pydantic==2.14.1" "pydantic-settings==2.16.1" \
            "requests==2.34.2" "python-multipart==0.0.32" \
            "langchain-core==0.3.79" \
            "langchain-community==0.4.2" "langchain-text-splitters==1.1.3" \
            "langchain-huggingface==1.2.3" "langchain-milvus==0.4.0" \
            "langchain-openai==1.7.3" \
            "python-docx==1.2.0" "python-pptx==1.0.2" "openpyxl==3.1.5" \
            "beautifulsoup4==4.15.0" "chardet==7.7.0" "reportlab==5.1.0" \
            "pypdf==6.21.3"

      - name: Lint (ruff)
        run: |
          pip install "ruff==0.8.6"
          ruff check src tests main.py run_ingestion.py

      - name: Tests
        run: pytest -q --cov=src --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore
