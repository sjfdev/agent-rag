<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="page.chatTitle">企业知识库助手</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --ok: #33c48d;
    --warn: #ffb020;
    --bad: #ff6b6b;
    --accent-fg: #ffffff;
    --border-strong: #3a4150;
    --accent-soft: #1e3a66;
    --overlay: rgba(7, 9, 13, .62);
  }
  /* Light preset mirrors the admin console so both pages share a look. */
  /* 浅色预设与管理台一致，两页共享同一套配色。 */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f6fa;
    --panel: #ffffff;
    --panel-2: #eef2f8;
    --text: #16202d;
    --muted: #5d6877;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --ok: #12805c;
    --warn: #a4610a;
    --bad: #d13438;
    --border: #d8dee9;
    --border-strong: #c2cbd8;
    --accent-soft: #dbe7ff;
    --overlay: rgba(0, 0, 0, .38);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .badge {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
  }
  .badge b { color: var(--ok); font-weight: 600; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; gap: 10px; max-width: 900px; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; flex: 0 0 30px;
    border-radius: 8px; display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
    background: var(--panel-2); color: var(--muted);
  }
  .msg.user .avatar { background: var(--accent-soft); color: var(--text); }
  .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 14px;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--accent-soft); border-color: var(--border-strong); }
  /* Rendered markdown: block elements need normal wrapping, not pre-wrap. */
  .bubble.md { white-space: normal; }
  .bubble.md p { margin: 0 0 8px; }
  .bubble.md p:last-child { margin-bottom: 0; }
  .bubble.md h4, .bubble.md h5, .bubble.md h6 {
    font-size: 14px; margin: 12px 0 6px; font-weight: 600;
  }
  .bubble.md ul, .bubble.md ol { margin: 0 0 8px; padding-left: 22px; }
  .bubble.md li { margin: 2px 0; }
  .bubble.md li.md-sub { list-style: circle; margin-left: 14px; }
  .bubble.md code {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bubble.md pre {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin: 8px 0;
    overflow-x: auto; white-space: pre;
  }
  .bubble.md pre code { background: none; border: 0; padding: 0; }
  .bubble.md blockquote {
    margin: 8px 0; padding: 2px 0 2px 10px;
    border-left: 3px solid var(--border-strong); color: var(--muted);
  }
  .bubble.md table {
    border-collapse: collapse; margin: 8px 0; font-size: 13px;
    display: block; overflow-x: auto; max-width: 100%;
  }
  .bubble.md th, .bubble.md td {
    border: 1px solid var(--border); padding: 4px 9px; text-align: left;
    white-space: nowrap;
  }
  .bubble.md th { background: var(--panel-2); font-weight: 600; }
  .bubble.md hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble.md a { color: var(--accent); }
  .bubble.md .md-note {
    margin-top: 8px; font-size: 12px; color: var(--warn);
  }
  .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11px; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 7px;
    font-variant-numeric: tabular-nums;
  }
  .chip.total { color: var(--accent); border-color: var(--border-strong); }
  footer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 18px;
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  input, select, textarea, button { font-family: inherit; }
  input, select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: 13px;
  }
  input { width: 90px; }
  textarea {
    width: 100%; resize: none; max-height: 200px; overflow-y: auto;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; line-height: 1.5;
  }
  textarea:focus, input:focus, select:focus { outline: 1px solid var(--accent); }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row textarea { flex: 1; }
  button.primary {
    background: var(--accent); color: var(--accent-fg); border: 0;
    border-radius: 10px; padding: 10px 18px; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  button.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; font-size: 13px;
  }
  button.ghost:hover { color: var(--text); }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .presets button {
    background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .presets button:hover { color: var(--text); border-color: var(--border-strong); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .error { color: var(--bad); }
  .srOnly {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  button:focus-visible, summary:focus-visible, a:focus-visible,
  .srchit:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .scrollBottom {
    /* --compose-offset tracks the real footer height (mobile keyboard + wrapped
       controls), so the button never sits under the input area. */
    position: absolute; right: 18px;
    bottom: calc(var(--compose-offset, 190px) + 12px); z-index: 20;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
  }
  .sessionClose { display: none; }
  .gate {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
    justify-content: center; background: var(--overlay); padding: 20px;
  }
  .gate[hidden] { display: none; }
  .gateCard {
    width: min(400px, 100%); background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; display: grid; gap: 10px;
  }
  .gateCard h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .gateCard p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .gateCard input { width: 100%; }
  .gateCard button.primary { width: 100%; }
  .gateErr { color: var(--bad); font-size: 12px; min-height: 16px; }
  [hidden] { display: none !important; }
  .layout { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; position: relative; }
  .sessionBar {
    width: 260px; flex: 0 0 260px; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  .sessionHead {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 12px 12px 10px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted); letter-spacing: .02em;
  }
  .sessionHead button { padding: 4px 9px; font-size: 12px; }
  .sessionList {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 8px; display: flex; flex-direction: column; gap: 4px;
  }
  .sessionItem {
    display: flex; align-items: stretch; gap: 4px;
    border: 1px solid transparent; border-radius: 8px;
  }
  .sessionItem.active { background: var(--panel-2); border-color: var(--accent); }
  .sessionOpen {
    flex: 1; min-width: 0; text-align: left; cursor: pointer;
    background: transparent; color: var(--text); border: 0;
    border-radius: 7px; padding: 8px 9px;
  }
  .sessionOpen:hover { background: var(--panel-2); }
  .sessionTitle {
    display: block; font-size: 13px; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sessionMeta {
    display: block; margin-top: 3px; font-size: 11px;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .sessionDel {
    flex: 0 0 28px; background: transparent; border: 0; cursor: pointer;
    color: var(--muted); font-size: 15px; line-height: 1; border-radius: 7px;
  }
  .sessionDel:hover { color: var(--bad); background: var(--panel-2); }
  .sessionRename {
    flex: 0 0 26px; background: transparent; border: 0; cursor: pointer;
    color: var(--muted); font-size: 13px; line-height: 1; border-radius: 7px;
  }
  .sessionRename:hover { color: var(--accent); background: var(--panel-2); }
  .sessionEmpty { padding: 16px 14px; font-size: 12px; color: var(--muted); }
  .sessionMore { margin: 8px 14px 12px; padding: 4px 9px; font-size: 12px; }
  .loadEarlier { margin: 0 0 12px; padding: 6px 10px; font-size: 12px; }
  .sessionMask {
    position: fixed; inset: 0; z-index: 39; background: var(--overlay);
  }
  #sessionToggle { display: none; }
  @media (max-width: 860px) {
    #sessionToggle { display: inline-block; }
    .sessionBar {
      position: fixed; z-index: 40; top: 0; bottom: 0; left: 0;
      width: min(300px, 86vw); flex-basis: auto;
      transform: translateX(-100%); transition: transform .18s ease;
      box-shadow: 0 0 30px rgba(0, 0, 0, .5);
    }
    .sessionBar.open { transform: none; }
  }
  @media (min-width: 861px) {
    .sessionMask { display: none !important; }
  }
  .sources { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .sources summary { cursor: pointer; color: var(--accent); outline: none; }
  .sources ul { margin: 8px 0 0; padding-left: 16px; }
  .sources li { margin: 8px 0; }
  .sources li.srchit { cursor: pointer; border-radius: 6px; padding: 4px 6px; margin-left: -6px; }
  .sources li.srchit:hover, .sources li.srchit:focus-visible {
    background: var(--panel-2); outline: none;
  }
  .srcpath { color: var(--text); }
  .snippet { color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .preview {
    position: fixed; inset: 0; z-index: 60; display: flex;
    align-items: center; justify-content: center; padding: 20px;
    background: var(--overlay);
  }
  .preview[hidden] { display: none; }
  .previewCard {
    width: min(860px, 100%); max-height: min(82vh, 900px); display: flex;
    flex-direction: column; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); overflow: hidden;
  }
  .previewHead {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px 8px;
    border-bottom: 1px solid var(--border);
  }
  .previewHead h3 { margin: 0; font-size: 14px; word-break: break-all; flex: 1; }
  .previewMeta { padding: 8px 18px; font-size: 12px; color: var(--muted); }
  .previewBody {
    padding: 4px 18px 18px; overflow: auto; white-space: pre-wrap;
    word-break: break-word; line-height: 1.6; font-size: 13px;
  }
  .previewBody.error { color: var(--bad); }
  .previewNote { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .previewClose { flex: none; }
  .whoami { color: var(--accent); border-color: var(--border-strong); }
  .chatStatus { position: relative; font-size: 12px; }
  .chatStatus summary {
    cursor: pointer; list-style: none; color: var(--muted);
    padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px;
  }
  .chatStatus summary::-webkit-details-marker { display: none; }
  .chatStatus[open] summary { color: var(--text); border-color: var(--accent); }
  .chatStatusBody {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
    display: grid; gap: 8px; min-width: 220px; padding: 10px;
    max-width: calc(100vw - 24px);
    background: var(--panel); border: 1px solid var(--border-strong);
    border-radius: 10px; box-shadow: 0 12px 32px rgba(0, 0, 0, .3);
  }
  .chatStatusBody > span, .menuRow {
    display: flex; justify-content: space-between; gap: 10px; color: var(--muted);
  }
  .chatStatusBody b { color: var(--text); font-weight: 500; }
  .chatStatusBody select { width: auto; }
  .msgActions {
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
  }
  .msgActions button {
    padding: 3px 8px; font-size: 11px; border-radius: 7px;
  }
  .feedbackGroup { display: inline-flex; gap: 6px; }
  .srchitNum {
    display: inline-block; min-width: 18px; text-align: center;
    margin-right: 6px; font-size: 11px; color: var(--accent);
  }
  .bubble.md a.cite {
    display: inline-block; margin: 0 1px; padding: 0 3px;
    border-radius: 4px; background: var(--accent-soft);
    font-size: 11px; line-height: 1.4; text-decoration: none;
    vertical-align: super;
  }
  .bubble.md a.cite:hover, .bubble.md a.cite:focus-visible {
    background: var(--accent); color: var(--accent-fg);
  }
  .msgActions button[aria-pressed="true"] {
    color: var(--accent); border-color: var(--accent);
  }
  .retrievalDebug { margin-top: 8px; font-size: 11px; color: var(--muted); }
  .retrievalDebug summary { cursor: pointer; color: var(--accent); }
  .retrievalDebug dl { margin: 6px 0 0; display: grid; gap: 4px; }
  .retrievalDebug dt { color: var(--muted); }
  .retrievalDebug dd { margin: 0; color: var(--text); word-break: break-word; }
  .retrievalDebug ol { margin: 4px 0 0; padding-left: 18px; }
  .retrievalDebug li { margin: 2px 0; word-break: break-word; }
  .renameInput { width: 100%; margin-bottom: 14px; }
  .gateHelp { margin: -2px 0 2px; font-size: 12px; color: var(--muted); }
  .sessionSearch { padding: 8px 10px 0; }
  .sessionSearch input { width: 100%; }
  .sessionStatus { padding: 6px 14px 0; font-size: 11px; color: var(--muted); }
  .sessionStatus.error { color: var(--bad); }
  .sessionRetry { margin: 6px 14px 0; padding: 4px 9px; font-size: 12px; }
  .charCount { font-size: 11px; color: var(--muted); text-align: right; margin: 0 0 4px; }
  .charCount.over { color: var(--bad); }
  .debugToggle {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: 10px; font-size: 11px; color: var(--muted); cursor: pointer;
  }
  .confirm {
    position: fixed; inset: 0; z-index: 70; display: flex;
    align-items: center; justify-content: center; padding: 20px;
    background: var(--overlay);
  }
  .confirm[hidden] { display: none; }
  .confirmCard {
    width: min(420px, 100%); background: var(--panel);
    border: 1px solid var(--border-strong); border-radius: 12px;
    padding: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  }
  .confirmCard h2 { margin: 0 0 8px; font-size: 14px; }
  .confirmCard p { margin: 0 0 16px; font-size: 13px; line-height: 1.6; color: var(--muted); }
  .confirmActions { display: flex; justify-content: flex-end; gap: 8px; }
  .confirmActions .dangerConfirm { background: var(--bad); color: #fff; }
  button.ghost:disabled { opacity: .5; cursor: not-allowed; }
  @media (max-width: 640px) {
    .preview { padding: 0; }
    .previewCard { width: 100%; max-height: 100%; height: 100%; border-radius: 0; }
    .previewBody { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
    header { padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 14px; }
    .badge { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { padding: 12px; gap: 10px; }
    .msg { max-width: 100%; }
    .bubble { font-size: 13.5px; padding: 9px 12px; }
    footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .controls { gap: 8px; }
    .controls label { flex: 1 1 40%; }
    .controls label input, .controls label select { flex: 1; min-width: 0; }
    .row { flex-wrap: wrap; }
    .row textarea { flex: 1 1 100%; font-size: 16px; }
    .row button { flex: 1 1 auto; }
    .presets {
      flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .presets button { flex: 0 0 auto; }
    .hint { line-height: 1.5; }
    .sessionClose { display: inline-block; }
    .scrollBottom { right: 12px; }
    .chatStatusBody {
      position: fixed; left: 12px; right: 12px; top: 64px;
      min-width: 0; max-height: 70vh; overflow-y: auto;
    }
  }
  .bubble.streaming::after { content: "▍"; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <button class="ghost" id="sessionToggle" type="button" aria-expanded="false" hidden
          title="会话" data-i18n-title="sessions.title"
          aria-label="会话" data-i18n-aria-label="sessions.title">☰</button>
  <h1 data-i18n="page.chatTitle">企业知识库助手</h1>
  <span class="badge whoami" id="whoami" hidden></span>
  <details class="chatStatus">
    <summary data-i18n="chat.status">状态</summary>
    <div class="chatStatusBody">
      <span><span data-i18n="common.store">向量库</span> <b id="store">-</b></span>
      <span><span data-i18n="common.model">模型</span> <b id="model">-</b></span>
      <label class="menuRow"><span data-i18n="admin.theme">主题</span>
        <select id="chatTheme" aria-label="主题" data-i18n-aria-label="admin.theme">
          <option value="dark" data-i18n="admin.theme.dark">深色</option>
          <option value="light" data-i18n="admin.theme.light">浅色</option>
          <option value="custom" data-i18n="admin.theme.custom">自定义</option>
        </select>
      </label>
    </div>
  </details>
  <select id="lang" aria-label="Language" data-i18n-aria-label="common.language" title="Language" data-i18n-title="common.language">
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
</header>

<div class="layout" id="layout">
  <aside class="sessionBar" id="sessionBar" hidden>
    <div class="sessionHead">
      <span data-i18n="sessions.title">会话</span>
      <button class="ghost" id="newSession" type="button" data-i18n="sessions.new">新对话</button>
      <button class="ghost sessionClose" id="sessionClose" type="button"
              data-i18n="common.close" data-i18n-aria-label="common.close"
              aria-label="关闭">关闭</button>
    </div>
    <div class="sessionSearch">
      <input id="sessionSearch" type="search" placeholder="搜索会话" data-i18n-placeholder="sessions.search" autocomplete="off">
    </div>
    <div class="sessionStatus" id="sessionStatus" hidden></div>
    <button class="ghost sessionRetry" id="sessionRetry" type="button" hidden data-i18n="common.retry">重试</button>
    <div class="sessionList" id="sessionList"></div>
    <button class="ghost sessionMore" id="sessionMore" type="button" hidden
            data-i18n="sessions.loadMore">加载更多</button>
    <div class="sessionEmpty" id="sessionEmpty" data-i18n="sessions.empty" hidden></div>
  </aside>
  <div class="sessionMask" id="sessionMask" hidden></div>

  <div class="pane">
    <main id="chat" role="log" aria-live="off" aria-label="对话" data-i18n-aria-label="chat.logLabel">
      <div class="msg bot">
        <div class="avatar" aria-hidden="true">AI</div>
        <div class="bubble" data-i18n="chat.greeting">选择一个部门后提问。不同部门只能检索到各自授权范围内的文档。</div>
      </div>
    </main>

    <footer>
  <div class="controls">
    <label id="uidLabel"><span data-i18n="chat.user">用户</span> <input id="uid" value="u1" /></label>
    <label id="deptLabel"><span data-i18n="chat.dept">部门</span>
      <select id="dept">
        <option>Tech</option>
        <option>HR</option>
        <option>Finance</option>

// Keep the transcript pinned to the newest message unless the user scrolled

function updateScrollButton() {

  scrollBottomBtn.hidden = !away;
  if (!away) stickToBottom = true;

});

// Keep the floating "back to bottom" button above the composer even when the
// footer grows (wrapped controls, soft keyboard, safe-area padding).
function syncComposeOffset() {
  if (!footerEl) return;
  const height = Math.round(footerEl.getBoundingClientRect().height) || 190;
  document.documentElement.style.setProperty("--compose-offset", height + "px");
}
syncComposeOffset();
window.addEventListener("resize", syncComposeOffset);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", syncComposeOffset);
}
if (window.ResizeObserver && footerEl) {
  new ResizeObserver(syncComposeOffset).observe(footerEl);
}

// --- authentication --------------------------------------------------------
// AUTH_MODE=none: the identity fields stay visible and are sent in the body.
// AUTH_MODE=jwt: the server ignores them and only trusts the bearer token, so
// they are hidden and a login gate is shown instead.
const TOKEN_KEY = "chatToken";
const BEARER_KEY = "chatBearer";
// `/ui/` and `/admin` share the bearer token so one login covers both pages.
// It lives in localStorage so it survives new tabs and browser restarts;
// sessionStorage is only read once to migrate older sessions.
// `/ui/` 与 `/admin` 共享 Bearer token，登录一次即可覆盖两个页面；保存在
// localStorage 以跨标签页/重启保持，sessionStorage 仅用于旧会话迁移。
const SHARED_BEARER_KEY = "ragBearer";
const authStore = {
  get(key) {
    try {
      const value = localStorage.getItem(key) || sessionStorage.getItem(key) || "";
      if (value && !localStorage.getItem(key)) localStorage.setItem(key, value);
      return value;
    } catch (error) {
      return "";
    }
  },
  set(key, value) {
    try {
      if (value) localStorage.setItem(key, value);
      else localStorage.removeItem(key);
      sessionStorage.removeItem(key);
    } catch (error) {}
  },
  remove(key) {
    try {
      localStorage.removeItem(key);
      sessionStorage.removeItem(key);
    } catch (error) {}
  },
};
let token = authStore.get(TOKEN_KEY);
let bearer = authStore.get(BEARER_KEY) || authStore.get(SHARED_BEARER_KEY) || "";
let authMode = "none";
let localLogin = false;

function hasCredential() {
  return Boolean(bearer || token);
}

// Keep the page-specific and shared copies in sync.
// 同步页面专属副本与共享副本。
function storeBearer(value) {
  bearer = value || "";
  authStore.set(BEARER_KEY, bearer);
  if (bearer) {
    authStore.set(SHARED_BEARER_KEY, bearer);
  } else {
    authStore.remove(SHARED_BEARER_KEY);
  }
}

function authHeaders(extra) {
  const headers = Object.assign({}, extra || {});
  if (bearer) headers["Authorization"] = "Bearer " + bearer;
  if (token) headers["X-API-Key"] = token;
  return headers;
}

function clearCredential() {
  bearer = "";
  token = "";
  authStore.remove(TOKEN_KEY);
  authStore.remove(BEARER_KEY);
  authStore.remove(SHARED_BEARER_KEY);
}

function showGate(message) {
  const gate = document.getElementById("gate");
  if (!gate) return;
  gate.hidden = false;
  if (whoami) whoami.hidden = true;
  const logout = document.getElementById("logout");
  if (logout) logout.hidden = true;
  if (switchAccountBtn) switchAccountBtn.hidden = true;
  if (message) document.getElementById("gateErr").textContent = message;
}

function hideGate() {
  const gate = document.getElementById("gate");
  if (gate) gate.hidden = true;
}

// The OIDC callback lands on a page with #token=<jwt>; keep it and strip the
// fragment so it is not left in the address bar or a shared link.
function consumeTokenFragment() {
  const hash = location.hash || "";
  if (!hash.startsWith("#token=")) return "";
  let value = "";
  try {
    value = decodeURIComponent(hash.slice("#token=".length));
  } catch (error) {
    value = "";
  }
  // NB: `history` below is the chat transcript, so use window.history here.
  window.history.replaceState(null, "", location.pathname + location.search);
  if (!value) return "";
  bearer = value;
  token = "";
  storeBearer(bearer);
  authStore.set(TOKEN_KEY, token);
  return value;
}

// Keep in sync with the backend's HISTORY_MAX_MESSAGES (default 20).
const HISTORY_MAX_MESSAGES = 20;

// Only the most recent messages are sent, starting at a user turn. This keeps
// long conversations working instead of hitting the request size limit.
function recentHistory() {
  const kept = history.slice(-HISTORY_MAX_MESSAGES);
  while (kept.length && kept[0].role !== "user") kept.shift();
  return kept;
}

// --- session persistence ---------------------------------------------------
const SESSION_KEY = "agent-rag-session-v1";
const SERVER_SESSION_KEY = "agent-rag-server-session-v1";

function saveSession() {
  try {
    localStorage.setItem(
      SESSION_KEY,
      JSON.stringify({
        history: recentHistory(),
        dept: deptSel.value,
        uid: uidInput.value,
        transcript: Array.from(chat.children)
          .filter((el) => el.dataset.persist !== "0")
          .map((el) => el.outerHTML),
      })
    );
  } catch (e) {
    /* private mode / quota: persistence is best-effort */
  }
}

function loadSession() {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
  } catch (e) {
    saved = null;
  }
  if (!saved || !Array.isArray(saved.history)) return;
  history = saved.history;
  if (saved.dept && [...deptSel.options].some((o) => o.value === saved.dept)) {
    deptSel.value = saved.dept;
  }
  if (saved.uid) uidInput.value = saved.uid;
  if (Array.isArray(saved.transcript)) {
    for (const html of saved.transcript) chat.insertAdjacentHTML("beforeend", html);
  }
  // Saved transcripts may have been recorded in another language.
  window.i18n.translateDom(chat);
  updateChatTools();
  scrollChat(true);
}

function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

// --- server-side sessions --------------------------------------------------
function currentUserId() {
  return uidInput.value.trim() || "u1";
}

function saveActiveSession() {
  try {
    localStorage.setItem(
      SERVER_SESSION_KEY,
      JSON.stringify({ sessionId, uid: currentUserId(), dept: deptSel.value })
    );
  } catch (e) {
    /* private mode: the server still owns this tab's transcript */
  }
}

function savedActiveSession() {
  try {
    return JSON.parse(localStorage.getItem(SERVER_SESSION_KEY) || "null");
  } catch (e) {
    return null;
  }
}

function clearActiveSession() {
  sessionId = "";
  try { localStorage.removeItem(SERVER_SESSION_KEY); } catch (e) {}
}

function setSidebar(open) {

function addDegradedNote(bubble) {
  const warn = document.createElement("div");

function renderSessions() {
  if (!sessionListEl) return;
  const query = (sessionSearch && sessionSearch.value || "").trim();
  // Server-side search matches message content too, so the returned page is
  // authoritative; filtering it again by title would hide content matches.
  const items = sessionsCache;
  sessionListEl.textContent = "";
  if (sessionEmpty) {
    sessionEmpty.hidden = items.length > 0;
    sessionEmpty.textContent = query ? t("sessions.noMatch") : t("sessions.empty");
  }
  if (sessionMore) sessionMore.hidden = !sessionsHasMore;
  const lang = window.i18n.currentLanguage();
  for (const item of items) {
    const row = document.createElement("div");
    row.className = "sessionItem" + (item.session_id === sessionId ? " active" : "");

    const open = document.createElement("button");
    open.type = "button";
    open.className = "sessionOpen";
    const title = document.createElement("span");
    title.className = "sessionTitle";
    title.textContent = item.title || t("sessions.untitled");
    const meta = document.createElement("span");
    meta.className = "sessionMeta";
    const count = t("sessions.messages", { count: item.message_count || 0 });
    const date = ChatSessions.formatDate(item.updated_at, lang);
    meta.textContent = date ? count + " · " + date : count;
    open.append(title, meta);
    open.title = item.title || t("sessions.untitled");
    open.onclick = () => openSession(item.session_id);

    const rename = document.createElement("button");
    rename.type = "button";
    rename.className = "sessionRename";
    rename.textContent = "✎";
    rename.title = t("sessions.rename");
    rename.setAttribute("aria-label", t("sessions.rename") + ": " + (item.title || t("sessions.untitled")));
    rename.onclick = (event) => {
      event.stopPropagation();
      openRename(item);
    };

    const del = document.createElement("button");
    del.type = "button";
    del.className = "sessionDel";
    del.textContent = "×";
    del.title = t("sessions.delete");
    del.setAttribute("aria-label", t("sessions.delete") + ": " + (item.title || t("sessions.untitled")));
    del.onclick = (event) => {
      event.stopPropagation();
      deleteServerSession(item.session_id);
    };

    row.append(open, rename, del);
    sessionListEl.appendChild(row);
  }
}

async function refreshSessions(reset) {
  if (!sessionsEnabled) return;
  const fromStart = reset !== false;
  if (sessionsLoading) {
    // A newer search arrived while the previous request was in flight; run it
    // once the current load finishes so results match the visible query.
    if (fromStart) sessionsPending = true;
    return;
  }
  sessionsLoading = true;
  if (sessionStatus && (!sessionsCache.length || !fromStart)) {
    sessionStatus.hidden = false;
    sessionStatus.classList.remove("error");
    sessionStatus.textContent = t("sessions.loading");
    if (sessionRetry) sessionRetry.hidden = true;
  }
  try {
    const offset = fromStart ? 0 : sessionsCache.length;
    const query = (sessionSearch && sessionSearch.value || "").trim();
    const res = await fetch(
      "/sessions?" + ChatSessions.sessionQuery(currentUserId(), query) +
        "&limit=" + SESSIONS_PAGE + "&offset=" + offset,
      { headers: authHeaders() }
    );
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    const page = Array.isArray(data.sessions) ? data.sessions : [];
    if (fromStart) {
      sessionsCache = page;
    } else {
      const known = new Set(sessionsCache.map((item) => item.session_id));
      sessionsCache = sessionsCache.concat(
        page.filter((item) => !known.has(item.session_id))
      );
    }
    sessionsHasMore = page.length === SESSIONS_PAGE;
    if (sessionStatus) sessionStatus.hidden = true;
    if (sessionRetry) sessionRetry.hidden = true;
    renderSessions();
  } catch (error) {
    // Keep the previous list; show a retry instead of failing silently.
    if (sessionStatus) {
      sessionStatus.hidden = false;
      sessionStatus.classList.add("error");
      sessionStatus.textContent = t("sessions.loadFailed");
    }
    if (sessionRetry) sessionRetry.hidden = false;
  } finally {
    sessionsLoading = false;
    if (sessionsPending) {
      sessionsPending = false;
      refreshSessions(true);
    }
  }
}

async function createServerSession() {
  if (!sessionsEnabled) return "";
  if (sessionId) return sessionId;
  try {
    const res = await fetch("/sessions", {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ user_id: currentUserId(), dept: deptSel.value }),
    });
    if (!res.ok) return "";
    const data = await res.json();
    if (!data.session_id) return "";
    sessionId = data.session_id;
    saveActiveSession();
    refreshSessions();
    return sessionId;
  } catch (error) {
    return "";
  }
}

function renderStoredMessage(message) {
  if (message.role === "user") {
    addMsg("user", message.content || "");
    return;
  }
  const bubble = addMsg("bot", "");
  if (message.content) setMarkdown(bubble, message.content);
  if (message.degraded) addDegradedNote(bubble);
  attachSources(bubble, message.sources);
  attachCitations(bubble, message.sources);
  const feedback = message.feedback || {};
  addActions(bubble, message.content || "", {
    sources: message.sources,
    messageSeq: message.seq,
    rating: feedback.rating,
  });
}

// Long sessions render the newest window first; "show earlier" keeps the
// transcript light without hiding history from the server.
// 长会话只先渲染最近一页；「显示更早」按页展开，历史仍由服务端保存。
function renderSessionMessages(toBottom) {
  chat.textContent = "";
  const start = Math.max(0, sessionMessages.length - sessionWindow);
  suppressScroll = true;
  if (start > 0) {
    const earlier = document.createElement("button");
    earlier.className = "ghost loadEarlier";
    earlier.type = "button";
    earlier.dataset.i18n = "chat.loadEarlier";
    earlier.dataset.i18nVars = JSON.stringify({ count: start });
    earlier.textContent = t("chat.loadEarlier", { count: start });
    earlier.onclick = () => {
      sessionWindow += SESSION_PAGE;
      renderSessionMessages(false);
    };
    chat.appendChild(earlier);
  }
  for (let index = start; index < sessionMessages.length; index++) {
    renderStoredMessage(sessionMessages[index]);
  }
  suppressScroll = false;
  if (toBottom) scrollChat(true);
  else chat.scrollTop = 0;
}

async function openSession(id, options) {
  if (!sessionsEnabled) return;
  if (busy && abortController) abortController.abort();
  try {
    const res = await fetch(
      "/sessions/" + encodeURIComponent(id) + "?" + ChatSessions.sessionQuery(currentUserId()),
      { headers: authHeaders() }
    );
    if (!res.ok) {
      if (res.status === 404) {
        clearActiveSession();
        sessionsCache = sessionsCache.filter((item) => item.session_id !== id);
        renderSessions();
        if (!options || !options.silent) startNewSession("sessions.missing");
      }
      return;
    }
    const data = await res.json();
    sessionId = data.session_id || id;
    saveActiveSession();
    if (data.dept) {
      if (![...deptSel.options].some((option) => option.value === data.dept)) {
        const option = document.createElement("option");
        option.value = data.dept;
        option.textContent = data.dept;
        deptSel.appendChild(option);
      }
      deptSel.value = data.dept;
    }
    const messages = Array.isArray(data.messages) ? data.messages : [];
    sessionMessages = messages;
    sessionWindow = SESSION_PAGE;
    history = messages.map((message) => ({
      role: message.role,
      content: message.content || "",
      sources: message.sources || [],
      degraded: Boolean(message.degraded),
      ts: message.created_at,
    }));
    renderSessionMessages(true);
    if (!messages.length) addMsg("bot", "", null, false, "chat.greeting");
    renderSessions();
    closeSidebar();
    updateChatTools();
    scrollChat(true);
  } catch (error) {
    addMsg("bot", "", null, true, "sessions.loadFailed", { error: error.message });
  }
}

let confirmResolve = null;
let confirmReturnFocus = null;
function askConfirm(message) {
  return new Promise((resolve) => {
    document.getElementById("confirmText").textContent = message;
    confirmReturnFocus = document.activeElement;
    confirmModal.hidden = false;
    confirmResolve = resolve;
    document.getElementById("confirmCancel").focus();
  });
}
function settleConfirm(value) {
  confirmModal.hidden = true;
  if (confirmReturnFocus && confirmReturnFocus.focus) confirmReturnFocus.focus();
  confirmReturnFocus = null;
  if (confirmResolve) confirmResolve(value);
  confirmResolve = null;
}
document.getElementById("confirmOk").onclick = () => settleConfirm(true);
document.getElementById("confirmCancel").onclick = () => settleConfirm(false);
confirmModal.addEventListener("click", (event) => {
  if (event.target === confirmModal) settleConfirm(false);
});

function showSessionStatus(message) {
  if (!sessionStatus) return;
  sessionStatus.hidden = false;
  sessionStatus.classList.add("error");
  sessionStatus.textContent = message;
  if (sessionRetry) sessionRetry.hidden = false;
}

function openRename(item) {
  if (!renameModal || !renameInput) return;
  renameTarget = item.session_id;
  renameInput.value = item.title || "";
  renameModal.hidden = false;
  renameInput.focus();
  renameInput.select();
}

function closeRename() {
  if (renameModal) renameModal.hidden = true;
  renameTarget = "";
}

async function submitRename() {
  const title = (renameInput && renameInput.value || "").trim();
  if (!renameTarget || !title) {
    closeRename();
    return;
  }
  const target = renameTarget;
  closeRename();
  try {
    const res = await fetch(
      "/sessions/" + encodeURIComponent(target) + "?" + ChatSessions.sessionQuery(currentUserId()),
      {
        method: "PATCH",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ title }),
      }
    );
    if (!res.ok) {
      showSessionStatus(t("sessions.renameFailed"));
      return;
    }
    const data = await res.json();
    const nextTitle = (data && data.title) || title;
    sessionsCache = sessionsCache.map((item) =>
      item.session_id === target ? Object.assign({}, item, { title: nextTitle }) : item
    );
    if (sessionStatus) sessionStatus.hidden = true;
    renderSessions();
  } catch (error) {
    showSessionStatus(t("sessions.renameFailed"));
  }
}

document.getElementById("renameForm").onsubmit = (event) => {
  event.preventDefault();
  submitRename();
};
document.getElementById("renameCancel").onclick = closeRename;
renameModal.addEventListener("click", (event) => {
  if (event.target === renameModal) closeRename();
});

async function deleteServerSession(id) {
  if (!sessionsEnabled || busy) return;
  if (!(await askConfirm(t("sessions.deleteConfirm")))) return;
  try {
    const res = await fetch(
      "/sessions/" + encodeURIComponent(id) + "?" + ChatSessions.sessionQuery(currentUserId()),
      { method: "DELETE", headers: authHeaders() }
    );
    if (!res.ok) {
      showSessionStatus(t("sessions.deleteFailed"));
      return;
    }
    sessionsCache = sessionsCache.filter((item) => item.session_id !== id);
    if (sessionId === id) startNewSession("sessions.deleted");
    if (sessionStatus) sessionStatus.hidden = true;
    await refreshSessions();
  } catch (error) {
    showSessionStatus(t("sessions.deleteFailed"));
  }
}

function addPosition(path, key, name, value) {
  const span = document.createElement("span");
  span.dataset.i18n = key;
  span.dataset.i18nVars = JSON.stringify({ [name]: value });
  span.textContent = t(key, { [name]: value });
  path.appendChild(span);
}

function attachSources(bubble, sources) {
  if (!sources || !sources.length) return;
  const box = document.createElement("details");
  box.className = "sources";

  const summary = document.createElement("summary");
  summary.dataset.i18n = "chat.sources";
  summary.dataset.i18nVars = JSON.stringify({ count: sources.length });
  summary.textContent = t("chat.sources", { count: sources.length });
  box.appendChild(summary);

  box.open = sources.length <= 3;
  const list = document.createElement("ul");
  for (const [index, src] of sources.entries()) {
    const item = document.createElement("li");
    item.className = "srchit";
    item.tabIndex = 0;
    item.dataset.cite = String(index + 1);
    item.title = t("chat.preview.hint");
    item.setAttribute("role", "button");
    item.setAttribute("aria-label", t("chat.citation", {
      n: index + 1,
      source: src.source || t("chat.unknownSource"),
    }));
    item.onclick = () => openSourcePreview(src);
    item.onkeydown = (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openSourcePreview(src);
      }
    };

    const path = document.createElement("div");
    path.className = "srcpath";

    const num = document.createElement("span");
    num.className = "srchitNum";
    num.textContent = `[${index + 1}]`;
    path.appendChild(num);

    const name = document.createElement("span");
    name.textContent = src.source || t("chat.unknownSource");
    if (!src.source) name.dataset.i18n = "chat.unknownSource";
    path.appendChild(name);

    if (src.page !== undefined) addPosition(path, "chat.page", "page", src.page);
    else if (src.slide !== undefined) addPosition(path, "chat.slide", "slide", src.slide);
    else if (src.sheet) addPosition(path, "chat.sheet", "sheet", src.sheet);

    const parts = [];
    if (src.dept) parts.push(t("chat.sourceDept", { dept: src.dept }));
    if (src.kind) parts.push(t("chat.sourceKind", { kind: src.kind }));
    if (src.title) parts.push(src.title);
    if (typeof src.score === "number") parts.push(t("chat.sourceScore"));
    path.title = parts.join("\n");
    item.appendChild(path);

    if (src.snippet) {
      const snippet = document.createElement("div");
      snippet.className = "snippet";
      snippet.textContent = src.snippet;
      item.appendChild(snippet);
    }
    list.appendChild(item);
  }
  box.appendChild(list);
  bubble.appendChild(box);
}

// Turn `[n]` in the rendered answer into a link to the matching citation.
// Text nodes inside code/links/the source list are left untouched.
const CITATION_RE = /\[(\d{1,3})\]/g;

function attachCitations(bubble, sources) {
  if (!Array.isArray(sources) || !sources.length) return;
  const walker = document.createTreeWalker(bubble, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      const parent = node.parentElement;
      if (!parent || parent.closest("pre, code, a, .sources, .msgActions, .meta, .retrievalDebug")) {
        return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue || "";
    CITATION_RE.lastIndex = 0;
    let match;
    let last = 0;
    let changed = false;
    const frag = document.createDocumentFragment();
    while ((match = CITATION_RE.exec(text)) !== null) {
      const number = Number(match[1]);
      if (!Number.isInteger(number) || number < 1 || number > sources.length) continue;
      changed = true;
      if (match.index > last) {
        frag.appendChild(document.createTextNode(text.slice(last, match.index)));
      }
      const link = document.createElement("a");
      link.className = "cite";
      link.href = "#";
      link.dataset.cite = String(number);
      link.textContent = match[0];
      link.setAttribute("aria-label", t("chat.citation", {
        n: number,
        source: sources[number - 1].source || t("chat.unknownSource"),
      }));
      link.onclick = (event) => {
        event.preventDefault();
        const source = sources[number - 1];
        if (source) openSourcePreview(source);
      };
      frag.appendChild(link);
      last = match.index + match[0].length;
    }
    if (!changed) continue;
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    if (node.parentNode) node.parentNode.replaceChild(frag, node);
  }
  CITATION_RE.lastIndex = 0;
}

function previewMeta(src) {
  const parts = [];
  if (src.dept) parts.push(t("chat.sourceDept", { dept: src.dept }));
  if (src.kind) parts.push(t("chat.sourceKind", { kind: src.kind }));
  const position = (key, vars) => t(key, vars).replace(/^[\s·]+/, "");
  if (src.page !== undefined) parts.push(position("chat.page", { page: src.page }));
  else if (src.slide !== undefined) parts.push(position("chat.slide", { slide: src.slide }));
  else if (src.sheet) parts.push(position("chat.sheet", { sheet: src.sheet }));
  return parts.join(" · ");
}

function closeSourcePreview() {
  const modal = document.getElementById("preview");
  if (modal && !modal.hidden) {
    modal.hidden = true;
    document.getElementById("previewBody").textContent = "";
    previewSource = null;
    if (previewOpenLink) previewOpenLink.hidden = true;
    if (previewDownloadLink) previewDownloadLink.hidden = true;
    if (previewReturnFocus && previewReturnFocus.focus) previewReturnFocus.focus();
    previewReturnFocus = null;
  }
}

function updatePreviewFileLinks(src) {
  if (!previewOpenLink || !previewDownloadLink) return;
  if (!src || !src.source) {
    previewOpenLink.hidden = true;
    previewDownloadLink.hidden = true;
    return;
  }
  const base = {
    source: src.source,
    page: src.page,
    slide: src.slide,
    sheet: src.sheet,
    userId: currentUserId(),
    dept: deptSel.value,
  };
  previewOpenLink.href = "#";
  previewDownloadLink.href = "#";
  previewOpenLink.hidden = false;
  previewDownloadLink.hidden = false;
}

// The links cannot use plain navigation: in jwt mode the browser would not
// send the bearer header, and CHAT_API_KEY would be missing too. Fetch with
// auth headers, then turn the response into a blob URL.
async function openPreviewFile(download) {
  if (!previewSource || !previewSource.source) return;
  const base = {
    source: previewSource.source,
    page: previewSource.page,
    slide: previewSource.slide,
    sheet: previewSource.sheet,
    userId: currentUserId(),
    dept: deptSel.value,
  };
  const popup = download ? null : window.open("", "_blank");
  if (popup) popup.opener = null;
  try {
    const res = await fetch(ChatSources.filePath(base), { headers: authHeaders() });
    if (res.status === 401) {
      if (popup) popup.close();
      clearCredential();
      closeSourcePreview();
      showGate(t("auth.expired"));
      return;
    }
    if (!res.ok) {
      throw new Error(res.status === 404 ? t("chat.preview.missing") : String(res.status));
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    if (download) {
      const link = document.createElement("a");
      link.href = url;
      link.download = previewSource.source.split("/").pop() || "source";
      document.body.appendChild(link);
      link.click();
      link.remove();
    } else if (popup) {
      popup.location.href = url;
    } else {
      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      link.remove();
    }
    setTimeout(() => URL.revokeObjectURL(url), 300000);
  } catch (error) {
    if (popup) popup.close();
    srStatus.textContent = t("chat.preview.fileFailed");
  }
}

let previewReturnFocus = null;

async function openSourcePreview(src) {
  const modal = document.getElementById("preview");
  if (!modal) return;
  const title = document.getElementById("previewTitle");
  const meta = document.getElementById("previewMeta");
  const body = document.getElementById("previewBody");
  previewReturnFocus = document.activeElement;
  previewSource = src;
  modal.hidden = false;
  previewCopyBtn.disabled = true;
  updatePreviewFileLinks(src);
  document.getElementById("previewClose").focus();
  body.classList.remove("error");
  title.textContent = src.source || t("chat.unknownSource");
  meta.textContent = previewMeta(src);
  body.textContent = t("chat.preview.loading");

  try {
    const res = await fetch(
      ChatSources.previewPath({
        source: src.source,
        page: src.page,
        slide: src.slide,
        sheet: src.sheet,
        userId: currentUserId(),
        dept: deptSel.value,
      }),
      { headers: authHeaders() }
    );
    if (res.status === 401) {
      clearCredential();
      closeSourcePreview();
      showGate(t("auth.expired"));
      return;
    }
    if (!res.ok) {
      throw new Error(res.status === 404 ? t("chat.preview.missing") : String(res.status));
    }
    const data = await res.json();
    const chunks = Array.isArray(data.chunks) ? data.chunks : [];
    const text = chunks.map((chunk) => chunk.text).join("\n\n");
    body.textContent = text || t("chat.preview.empty");
    previewCopyBtn.disabled = false;
    if (data.title) meta.textContent = [data.title, meta.textContent].filter(Boolean).join(" · ");
    if (data.truncated) {
      const note = document.createElement("div");
      note.className = "previewNote";
      note.textContent = t("chat.preview.truncated", { count: chunks.length });
      body.appendChild(note);
    }
  } catch (error) {
    body.classList.add("error");
    body.textContent = t("chat.preview.failed", { error: error.message });
    previewCopyBtn.disabled = false;
  }
}

previewCopyBtn.onclick = async () => {
  const text = document.getElementById("previewBody").textContent || "";
  try {
    await navigator.clipboard.writeText(text);
    previewCopyBtn.dataset.i18n = "chat.copied";
    previewCopyBtn.textContent = t("chat.copied");
    setTimeout(() => {
      previewCopyBtn.dataset.i18n = "chat.copy";
      previewCopyBtn.textContent = t("chat.copy");
    }, 1200);
  } catch (error) {
    previewCopyBtn.textContent = t("chat.copyFailed");
  }
};

document.getElementById("previewClose").onclick = closeSourcePreview;
previewOpenLink.onclick = (event) => {
  event.preventDefault();
  openPreviewFile(false);
};
previewDownloadLink.onclick = (event) => {
  event.preventDefault();
  openPreviewFile(true);
};
document.getElementById("preview").onclick = (event) => {
  if (event.target.id === "preview") closeSourcePreview();
};
document.addEventListener("keydown", (event) => {
  if (!confirmModal.hidden) {
    if (event.key === "Escape") {
      event.preventDefault();
      settleConfirm(false);
      return;
    }
    if (event.key !== "Tab") return;
    const buttons = [
      document.getElementById("confirmCancel"),
      document.getElementById("confirmOk"),
    ];
    const first = buttons[0];
    const last = buttons[1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
    return;
  }
  if (renameModal && !renameModal.hidden) {
    if (event.key === "Escape") {
      event.preventDefault();
      closeRename();
      return;
    }
    if (event.key !== "Tab") return;
    const fields = [
      renameInput,
      document.getElementById("renameCancel"),
      document.getElementById("renameOk"),
    ].filter(Boolean);
    const firstField = fields[0];
    const lastField = fields[fields.length - 1];
    if (event.shiftKey && document.activeElement === firstField) {
      event.preventDefault();
      lastField.focus();
    } else if (!event.shiftKey && document.activeElement === lastField) {
      event.preventDefault();
      firstField.focus();
    }
    return;
  }
  const modal = document.getElementById("preview");
  if (!modal || modal.hidden) return;
  if (event.key === "Escape") {
    closeSourcePreview();
    return;
  }
  if (event.key !== "Tab") return;
  const focusable = Array.from(
    modal.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    )
  ).filter((el) => !el.hidden && el.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

function regenerateAnswer(bubble, question) {
  if (busy) return;
  const wrap = bubble.closest(".msg");
  const bots = chat.querySelectorAll(".msg.bot");
  if (!wrap || wrap !== bots[bots.length - 1]) return;
  wrap.remove();
  // Drop the last stored pair so the retried turn does not duplicate history.
  if (history.length >= 2) {
    const last = history[history.length - 1];
    const prev = history[history.length - 2];
    if (last.role === "assistant" && prev.role === "user" && prev.content === question) {
      history.splice(-2, 2);
    }
  }
  send({ text: question, retry: true });
}

async function copyText(value) {
  try {
    await navigator.clipboard.writeText(value);
    return true;
  } catch (error) {
    // Clipboard API needs a secure context; fall back for plain-http LAN use.
    try {
      const area = document.createElement("textarea");
      area.value = value;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      return ok;
    } catch (fallbackError) {
      return false;
    }
  }
}

function shareSession() {
  if (!sessionId) return;
  const url = new URL(location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set("session", sessionId);
  copyText(url.toString()).then((ok) => {
    srStatus.textContent = t(ok ? "chat.shared" : "chat.shareFailed");
  });
}

async function submitFeedback(seq, rating, up, down) {
  if (!sessionId || !seq) return;
  try {
    const res = await fetch(
      "/sessions/" + encodeURIComponent(sessionId) + "/feedback?" +
        ChatSessions.sessionQuery(currentUserId()),
      {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ seq, rating }),
      }
    );
    if (!res.ok) throw new Error(String(res.status));
    up.setAttribute("aria-pressed", rating === 1 ? "true" : "false");
    down.setAttribute("aria-pressed", rating === -1 ? "true" : "false");
    srStatus.textContent = t("chat.feedback.saved");
  } catch (error) {
    srStatus.textContent = t("chat.feedback.failed");
  }
}

function addActions(bubble, text, options) {
  const opts = options || {};
  let bar = bubble.querySelector(".msgActions");
  if (!bar) {
    bar = document.createElement("div");
    bar.className = "msgActions";
    bubble.appendChild(bar);
  }
  const copy = document.createElement("button");
  copy.className = "ghost";
  copy.dataset.i18n = "chat.copy";
  copy.textContent = t("chat.copy");
  copy.setAttribute("aria-label", t("chat.copy"));
  copy.onclick = async () => {
    if (await copyText(text)) {
      copy.dataset.i18n = "chat.copied";
      copy.textContent = t("chat.copied");
      copy.setAttribute("aria-label", t("chat.copied"));
      setTimeout(() => {
        copy.dataset.i18n = "chat.copy";
        copy.textContent = t("chat.copy");
        copy.setAttribute("aria-label", t("chat.copy"));
      }, 1200);
    } else {
      copy.dataset.i18n = "chat.copyFailed";
      copy.textContent = t("chat.copyFailed");
      copy.setAttribute("aria-label", t("chat.copyFailed"));
    }
  };
  bar.appendChild(copy);
  if (opts.question) {
    chat.querySelectorAll('[data-action="regenerate"]').forEach((el) => el.remove());
    const again = document.createElement("button");
    again.className = "ghost";
    again.dataset.action = "regenerate";
    again.dataset.i18n = "chat.regenerate";
    again.textContent = t("chat.regenerate");
    again.setAttribute("aria-label", t("chat.regenerate"));
    again.onclick = () => regenerateAnswer(bubble, opts.question);
    bar.appendChild(again);
  }
  if (opts.messageSeq) {
    const group = document.createElement("span");
    group.className = "feedbackGroup";
    group.setAttribute("role", "group");
    group.setAttribute("aria-label", t("chat.feedback.group"));
    const make = (rating, key) => {
      const button = document.createElement("button");
      button.className = "ghost";
      button.type = "button";
      button.dataset.rating = String(rating);
      button.dataset.i18n = key;
      button.textContent = t(key);
      button.setAttribute("aria-label", t(key));
      button.setAttribute("aria-pressed", opts.rating === rating ? "true" : "false");
      return button;
    };
    const up = make(1, "chat.feedback.up");
    const down = make(-1, "chat.feedback.down");
    up.onclick = () => submitFeedback(opts.messageSeq, 1, up, down);
    down.onclick = () => submitFeedback(opts.messageSeq, -1, up, down);
    group.append(up, down);
    bar.appendChild(group);
  }
  if (sessionsEnabled && sessionId) {
    const share = document.createElement("button");
    share.className = "ghost";
    share.dataset.i18n = "chat.share";
    share.textContent = t("chat.share");
    share.setAttribute("aria-label", t("chat.share"));
    share.onclick = shareSession;
    bar.appendChild(share);
  }
}

function exportChat() {
  if (!history.length) return;
  const lines = ["# " + t("page.chatTitle"), ""];
  for (const message of history) {
    const who = message.role === "user" ? t("chat.user") : t("common.model");
    let heading = "## " + who;
    if (message.ts) {
      const when = new Date(message.ts);
      if (!Number.isNaN(when.getTime())) heading += " · " + when.toLocaleString();
    }
    lines.push(heading, "", message.content || "");
    if (message.role === "assistant") {
      if (message.degraded) lines.push("", "> " + t("chat.degradedNote"));
      if (Array.isArray(message.sources) && message.sources.length) {
        lines.push("", "> " + t("chat.exportSources"));
        message.sources.forEach((src, index) => {
          const meta = previewMeta(src);
          lines.push(
            `> [${index + 1}] ${src.source || t("chat.unknownSource")}` +
              (meta ? " — " + meta : "")
          );
        });
      }
    }
    lines.push("");
  }
  const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
  link.download = "chat-" + stamp + ".md";
  link.click();
  URL.revokeObjectURL(link.href);
}

exportBtn.onclick = exportChat;

function addRetry(bubble, text) {
  const retry = document.createElement("button");
  retry.className = "ghost";
  retry.style.marginLeft = "10px";
  retry.dataset.i18n = "chat.retry";
  retry.textContent = t("chat.retry");
  retry.setAttribute("aria-label", t("chat.retry"));
  retry.onclick = () => {
    const wrap = bubble.closest(".msg");
    if (wrap) wrap.remove();
    else bubble.remove();
    send({ text, retry: true });
  };
  bubble.appendChild(retry);
}

function errorMessage(code) {
  if (code === "upstream_unavailable") return t("chat.error.upstream");
  if (code === "maintenance" || code === "index rebuilding") return t("chat.error.maintenance");
  if (code === "vector_store_unavailable") return t("chat.error.vectorStore");
  return t("chat.error.internal");
}

function attachTimings(bubble, timings) {
  if (!timings) return;
  bubble._timings = timings;
  renderTimings(bubble);
}

function attachRetrieval(bubble, retrieval) {
  if (!retrieval || !Object.keys(retrieval).length) return;
  bubble._retrieval = retrieval;
  renderTimings(bubble);
}

function debugSourceLabel(item) {
  if (!item) return t("chat.unknownSource");
  let label = item.source || t("chat.unknownSource");
  if (item.page !== undefined) label += " p." + item.page;
  else if (item.slide !== undefined) label += " slide " + item.slide;
  else if (item.sheet) label += " · " + item.sheet;
  if (typeof item.score === "number") label += " · " + item.score.toFixed(3);
  return label;
}

function renderRetrievalDebug(retrieval) {
  const details = document.createElement("details");
  details.className = "retrievalDebug";
  const summary = document.createElement("summary");
  summary.dataset.i18n = "chat.debugRetrieval";
  summary.textContent = t("chat.debugRetrieval");
  details.appendChild(summary);

  const list = document.createElement("dl");
  const row = (label, value) => {
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = value;
    list.append(dt, dd);
  };
  if (retrieval.query) row(t("chat.debug.query"), retrieval.query);
  if (Array.isArray(retrieval.depts) && retrieval.depts.length) {
    row(t("chat.debug.depts"), retrieval.depts.join(", "));
  }
  const engine = retrieval.engine || "vector";
  const flags = [engine];
  if (retrieval.hybrid) flags.push("hybrid");
  if (retrieval.rerank) flags.push("rerank");
  row(t("chat.debug.engine"), flags.join(" · "));
  details.appendChild(list);

  const addList = (label, items) => {
    if (!Array.isArray(items) || !items.length) return;
    const heading = document.createElement("div");
    heading.textContent = label;
    const ordered = document.createElement("ol");
    for (const item of items.slice(0, 12)) {
      const li = document.createElement("li");
      li.textContent = debugSourceLabel(item);
      ordered.appendChild(li);
    }
    details.append(heading, ordered);
  };
  const hasRecall = Array.isArray(retrieval.candidates) && retrieval.candidates.length;
  if (hasRecall) {
    addList(t("chat.debug.candidates"), retrieval.candidates);
    addList(t("chat.debug.reranked"), retrieval.reranked);
  } else {
    addList(t("chat.debug.candidates"), retrieval.sources);
  }
  return details;
}

function renderTimings(bubble) {
  const old = bubble.querySelector(".meta.timings");
  if (old) old.remove();
  const oldDebug = bubble.querySelector(".retrievalDebug");
  if (oldDebug) oldDebug.remove();
  const timings = bubble._timings;
  if (!debugTimings) return;
  const actions = bubble.querySelector(".msgActions");
  const insert = (node) => {
    if (actions) bubble.insertBefore(node, actions);
    else bubble.appendChild(node);
  };
  if (timings) {
    const meta = document.createElement("div");
    meta.className = "meta timings";
    const order = [
      ["total_ms", "chat.timing.total"],
      ["retrieval_ms", "chat.timing.retrieval"],
      ["rerank_ms", "chat.timing.rerank"],
      ["llm_ms", "chat.timing.llm"],
      ["overhead_ms", "chat.timing.overhead"],
    ];
    const addChip = (key, vars, extraClass) => {
      const chip = document.createElement("span");
      chip.className = "chip" + (extraClass ? " " + extraClass : "");
      chip.dataset.i18n = key;
      if (vars) chip.dataset.i18nVars = JSON.stringify(vars);
      chip.textContent = t(key, vars);
      meta.appendChild(chip);
    };
    for (const [key, label] of order) {
      if (timings[key] !== undefined && !(key === "rerank_ms" && !timings[key])) {
        addChip(label, { value: timings[key] }, key === "total_ms" ? "total" : "");
      }
    }
    if (timings.llm_calls !== undefined) {
      addChip("chat.llmCalls", { count: timings.llm_calls });
    }
    if (timings.retrieval_calls !== undefined) {
      addChip("chat.retrievalCalls", { count: timings.retrieval_calls });
    }
    if (timings.cached) addChip("chat.cached", null, "total");
    if (timings.degraded) addChip("chat.degraded", null, "total");
    insert(meta);
  }
  if (bubble._retrieval) insert(renderRetrievalDebug(bubble._retrieval));
}

if (debugToggle) {
  debugToggle.onchange = () => {
    debugTimings = debugToggle.checked;
    try { localStorage.setItem("chatDebug", debugTimings ? "1" : "0"); } catch (e) {}
    chat.querySelectorAll(".bubble").forEach((bubble) => {
      if (bubble._timings) renderTimings(bubble);
    });
  };
}

function addMsg(role, text, timings, isError, i18nKey, i18nVars) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "bot");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.setAttribute("aria-hidden", "true");
  avatar.textContent = role === "user" ? "U" : "AI";

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (isError ? " error" : "");
  if (i18nKey) {
    const span = document.createElement("span");
    span.dataset.i18n = i18nKey;
    if (i18nVars) span.dataset.i18nVars = JSON.stringify(i18nVars);
    span.textContent = t(i18nKey, i18nVars);
    bubble.appendChild(span);
  } else {
    bubble.textContent = text;
  }

  if (timings) attachTimings(bubble, timings);

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  if (!suppressScroll) scrollChat(role === "user");
  return bubble;
}

async function send(options) {
  const opts = options || {};
  const text = (opts.text || input.value).trim();
  if (!text || busy) return;
  if (text.length > 4000) {
    addMsg("bot", "", null, true, "chat.tooLong");
    return;
  }

  busy = true;
  sendBtn.disabled = true;
  stopBtn.hidden = false;
  chat.setAttribute("aria-busy", "true");
  srStatus.textContent = t("chat.streamingAnnounce");
  if (!opts.retry) {
    input.value = "";
    addMsg("user", text);
    if (presetsBox) presetsBox.hidden = true;
  }

  const bubble = addMsg("bot", "", null, false, "chat.thinking");
  bubble.classList.add("streaming");
  scrollChat(true);
  const started = performance.now();
  let answer = "";
  let timings = null;
  let sources = [];
  let retrieval = {};
  let messageSeq = 0;
  let degraded = false;

  abortController = new AbortController();
  try {
    // Server-side sessions: create one lazily on the first turn. If creation
    // fails, buildChatBody falls back to the bounded local history.
    const activeSession = await createServerSession();
    const resp = await fetch("/chat/stream", {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      signal: abortController.signal,
      body: JSON.stringify(
        ChatSessions.buildChatBody({
          userId: currentUserId(),
          dept: deptSel.value,
          message: text,
          sessionId: activeSession,
          history: recentHistory(),
          maxHistory: HISTORY_MAX_MESSAGES,
        })
      ),
    });

    if (!resp.ok) {
      let detail = resp.status;
      try { detail = (await resp.json()).detail || detail; } catch (e) {}
      bubble.classList.remove("streaming");
      bubble.classList.add("error");
      bubble.classList.remove("md");
      if (resp.status === 401) {
        // The token expired or the account was disabled: back to the gate.
        clearCredential();
        restoreDraft(text);
        showGate(t("auth.expired"));
      }
      const code = typeof detail === "object" && detail ? detail.error : null;
      if (resp.status === 503 || code === "maintenance") {
        bubble.textContent = errorMessage(code || "upstream_unavailable", detail && detail.request_id);
        addRetry(bubble, text);
      } else if (resp.status === 400) {
        bubble.textContent =
          code === "missing_department"
            ? t("chat.error.missingDepartment")
            : t("chat.error.invalidDepartment");
      } else if (resp.status === 422) {
        bubble.textContent = t("chat.error.tooManyMessages");
      } else if (resp.status === 429) {
        bubble.textContent = t("chat.error.rateLimited");
        addRetry(bubble, text);
      } else if (resp.status === 413) {
        bubble.textContent = t("chat.error.payloadTooLarge");
        addRetry(bubble, text);
      } else {
        bubble.textContent = t("chat.error.requestFailed", {
          detail: typeof detail === "object" ? JSON.stringify(detail) : detail,
        });
        if (resp.status >= 500) addRetry(bubble, text);
      }
      if (resp.status === 413 || resp.status === 429 || resp.status >= 500) {
        restoreDraft(text);
      }
      srStatus.textContent = bubble.textContent;
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let firstToken = true;
    let lastPaint = 0;
    const paintStream = (force) => {
      const now = performance.now();
      if (!force && now - lastPaint < 120) return;
      lastPaint = now;
      setMarkdown(bubble, answer);
      scrollChat();
    };

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (!raw.startsWith("data: ")) continue;

        let ev;
        try { ev = JSON.parse(raw.slice(6)); } catch (e) { continue; }

        if (ev.type === "token") {
          if (firstToken) {
            firstToken = false;
            bubble.textContent = "";
          }
          answer += ev.content;
          paintStream(false);
        } else if (ev.type === "done") {
          timings = ev.timings;
          if (ev.sources) sources = ev.sources;
          if (ev.retrieval) retrieval = ev.retrieval;
          if (ev.degraded) degraded = true;
          if (ev.message_seq) messageSeq = ev.message_seq;
          if (ev.session_id) {
            sessionId = ev.session_id;
            saveActiveSession();
          }
        } else if (ev.type === "error") {
          bubble.classList.remove("streaming");
          bubble.classList.add("error");
          bubble.textContent = errorMessage(ev.code, ev.request_id) + " request_id=" + ev.request_id;
          if (["upstream_unavailable", "maintenance", "vector_store_unavailable"].includes(ev.code)) {
            addRetry(bubble, text);
          }
        }
      }
    }

    bubble.classList.remove("streaming");
    if (answer) {
      // Render the finished reply as markdown; streaming stays plain text so
      // a partially-typed table never flickers into a broken layout. An error
      // event aborts the reply, so keep its plain message in that case.
      if (bubble.classList.contains("error")) {
        bubble.textContent = answer;
      } else {
        setMarkdown(bubble, answer);
      }
      if (degraded) addDegradedNote(bubble);
      attachSources(bubble, sources);
      attachCitations(bubble, sources);
      attachTimings(bubble, timings);
      attachRetrieval(bubble, retrieval);
      addActions(bubble, answer, {
        question: text,
        sources,
        messageSeq,
        rating: 0,
      });
      srStatus.textContent = t("chat.answerReady");
      const stamp = new Date().toISOString();
      history.push({ role: "user", content: text, ts: stamp });
      history.push({
        role: "assistant",
        content: answer,
        sources,
        degraded,
        timings,
        ts: new Date().toISOString(),
      });
      if (sessionsEnabled) {
        saveActiveSession();
        refreshSessions();
      } else {
        saveSession();
      }
      updateChatTools();
    } else if (!bubble.classList.contains("error")) {
      bubble.textContent = t("chat.empty");
    }
  } catch (e) {
    bubble.classList.remove("streaming");
    if (e.name === "AbortError") {
      if (answer) {
        setMarkdown(bubble, answer);
        addActions(bubble, answer);
        const note = document.createElement("div");
        note.className = "md-note";
        note.textContent = t("chat.stoppedNote");
        bubble.appendChild(note);
      } else {
        bubble.classList.remove("md");
        bubble.classList.add("error");
        bubble.textContent = t("chat.stopped");
      }
    } else {
      bubble.classList.remove("md");
      bubble.classList.add("error");
      bubble.textContent = t("chat.networkError", { error: e.message });
      addRetry(bubble, text);
      restoreDraft(text);
    }
    if (document.body.contains(bubble)) srStatus.textContent = bubble.textContent;
  } finally {
    busy = false;
    sendBtn.disabled = false;
    stopBtn.hidden = true;
    abortController = null;
    chat.setAttribute("aria-busy", "false");
    input.focus();
  }
}

// Esc stops an in-flight answer, but never steals Escape from a dialog/drawer.
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape" || !busy || !abortController) return;
  if (!confirmModal.hidden || (renameModal && !renameModal.hidden)) return;
  const preview = document.getElementById("preview");
  if (preview && !preview.hidden) return;
  const gate = document.getElementById("gate");
  if (gate && !gate.hidden) return;
  if (sessionBar && sessionBar.classList.contains("open")) return;
  event.preventDefault();
  abortController.abort();
});
input.addEventListener("keydown", e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// Switching department or user must not carry the previous context over:

  sessionMessages = [];
  sessionWindow = SESSION_PAGE;
  clearActiveSession();
  clearSession();
  chat.innerHTML = "";
  addMsg("bot", "", null, false, key, vars);
  if (sessionsEnabled) renderSessions();
  updateChatTools();
  input.focus();
}

  if (!sessionBar.classList.contains("open")) return;
  if (!sessionToggle || sessionToggle.offsetParent === null) return;
  if (event.key === "Escape") {
    event.preventDefault();
    closeSidebar();
    return;
  }
  if (event.key !== "Tab") return;
  const focusable = Array.from(sessionBar.querySelectorAll("button")).filter(
    (el) => !el.hidden && el.offsetParent !== null
  );
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

async function passwordLogin(username, password) {
  const res = await fetch("/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password }),
  });
  if (!res.ok) {
    document.getElementById("gateErr").textContent =
      res.status === 429 ? t("auth.tooMany") : t("auth.badCredentials");
    return false;
  }
  const data = await res.json();
  if (!data.token) return false;
  bearer = data.token;
  token = "";
  storeBearer(bearer);
  authStore.set(TOKEN_KEY, token);
  document.getElementById("password").value = "";
  if (data.user && data.user.username) uidInput.value = data.user.username;
  if (data.user && data.user.depts && data.user.depts.length) {
    const dept = data.user.depts[0];
    if (![...deptSel.options].some((o) => o.value === dept)) {
      const option = document.createElement("option");
      option.value = dept;
      option.textContent = dept;
      deptSel.appendChild(option);
    }
    deptSel.value = dept;
  }
  return true;
}

// Who are we? In jwt mode the answer decides whether the gate is shown.
async function resolveAuth() {
  const fields = [document.getElementById("uidLabel"), document.getElementById("deptLabel")];
  if (authMode !== "jwt") {
    fields.forEach((el) => { if (el) el.hidden = false; });
    hideGate();
    updatePresets();
    return true;
  }
  fields.forEach((el) => { if (el) el.hidden = true; });
  const logout = document.getElementById("logout");
  if (logout) logout.hidden = false;
  if (switchAccountBtn) switchAccountBtn.hidden = false;
  if (!hasCredential()) {
    showGate();
    return false;
  }
  try {
    const res = await fetch("/admin/api/session", { headers: authHeaders() });
    if (!res.ok) {
      clearCredential();
      showGate(t("auth.expired"));
      return false;
    }
    const info = await res.json();
    identity = info;
    if (info.user_id) {
      uidInput.value = info.user_id;
      whoami.hidden = false;
      whoami.textContent = info.user_id;
      whoami.title = (info.depts || []).join(", ");
    }
    uidLabel.hidden = Boolean(info.user_id);
    if (info.depts && info.depts.length) {
      // Only offer the departments carried by the token; the server rejects
      // anything else, so a hardcoded list would just produce 400s.
      // 只展示 token 里的部门，避免硬编码选项触发 400。
      deptSel.innerHTML = "";
      for (const name of info.depts) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        deptSel.appendChild(option);
      }
      deptSel.value = info.depts[0];
      deptSel.disabled = info.depts.length === 1;
      deptLabel.hidden = false;
      updatePresets();
    }
    hideGate();
    return true;
  } catch (error) {
    showGate(t("auth.unreachable", { error: error.message }));
    return false;
  }
}

document.getElementById("loginForm").onsubmit = async (event) => {
  event.preventDefault();
  document.getElementById("gateErr").textContent = "";
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const pasted = document.getElementById("credential").value.trim();
  if (pasted) {
    bearer = pasted;
    token = "";
    storeBearer(bearer);
    authStore.set(TOKEN_KEY, token);
    document.getElementById("credential").value = "";
  } else if (username && password) {
    if (!(await passwordLogin(username, password))) return;
  } else {
    document.getElementById("gateErr").textContent = t("auth.enterCredentials");
    return;
  }
  if (!(await resolveAuth())) return;
  await refreshSessions();
  if (SHARED_SESSION && sessionsEnabled) {
    await openSession(SHARED_SESSION);
  } else {
    startNewSession("auth.signedInNew");
  }
  updateChatTools();
};

  startNewSession("auth.signedOut");

};

if (switchAccountBtn) {

  };
}

(async function boot() {
  const fromSso = consumeTokenFragment();
  const store = document.getElementById("store");
  const model = document.getElementById("model");
  try {
    const info = await fetch("/info").then((r) => r.json());
    authMode = info.auth_mode || "none";
    localLogin = Boolean(info.local_login);
    sessionsEnabled = Boolean(info.sessions_enabled);
    store.textContent = info.vector_store || "-";
    model.textContent = info.llm_model || "-";
  } catch (error) {
    // Keep working in "none" mode if /info is unreachable.
  }
  if (authMode === "jwt" && !localLogin) {
    // No account store: only a pasted token can log in.
    document.getElementById("username").hidden = true;
    document.getElementById("password").hidden = true;
    document.getElementById("tokenFallback").open = true;
    // "Forgot password" is meaningless without local accounts.
    const gateHelp = document.getElementById("gateHelp");
    if (gateHelp) gateHelp.hidden = true;
  }
  if (authMode === "jwt") document.getElementById("tokenFallback").open = !localLogin;
  const authed = await resolveAuth();
  if (authed) {
    const freshView = Boolean(new URLSearchParams(location.search).get("new"));
    if (sessionsEnabled) {
      sessionBar.hidden = false;
      sessionToggle.hidden = false;
      if (freshView) clearActiveSession();
      await refreshSessions();
      // A shared link wins; otherwise reopen this tab's last session. A deleted
      // one falls back to the greeting without an error during boot.
      if (SHARED_SESSION) {
        await openSession(SHARED_SESSION);
      } else {
        const saved = freshView ? null : savedActiveSession();
        if (saved && saved.sessionId && saved.uid === currentUserId()) {
          await openSession(saved.sessionId, { silent: true });
        }
      }
    } else if (!freshView) {
      // Older servers (or SESSIONS_ENABLED=false) keep the localStorage transcript.
      loadSession();
    }
    updateChatTools();
    updateCharCount();
  } else if (fromSso) {
    showGate(t("auth.invalidSso"));
  }
})();
</script>
</body>
</html>
