<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="page.chatTitle">企业知识库 Agent · 测试台</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --ok: #33c48d;
    --warn: #ffb020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .badge {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
  }
  .badge b { color: var(--ok); font-weight: 600; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; gap: 10px; max-width: 900px; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; flex: 0 0 30px;
    border-radius: 8px; display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
    background: var(--panel-2); color: var(--muted);
  }
  .msg.user .avatar { background: #24406e; color: #cfe0ff; }
  .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 14px;
    word-break: break-word;
  }
  .msg.user .bubble { background: #1b2a44; border-color: #2b4066; }
  /* Rendered markdown: block elements need normal wrapping, not pre-wrap. */
  .bubble.md { white-space: normal; }
  .bubble.md p { margin: 0 0 8px; }
  .bubble.md p:last-child { margin-bottom: 0; }
  .bubble.md h4, .bubble.md h5, .bubble.md h6 {
    font-size: 14px; margin: 12px 0 6px; font-weight: 600;
  }
  .bubble.md ul, .bubble.md ol { margin: 0 0 8px; padding-left: 22px; }
  .bubble.md li { margin: 2px 0; }
  .bubble.md li.md-sub { list-style: circle; margin-left: 14px; }
  .bubble.md code {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bubble.md pre {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin: 8px 0;
    overflow-x: auto; white-space: pre;
  }
  .bubble.md pre code { background: none; border: 0; padding: 0; }
  .bubble.md blockquote {
    margin: 8px 0; padding: 2px 0 2px 10px;
    border-left: 3px solid #33405a; color: var(--muted);
  }
  .bubble.md table {
    border-collapse: collapse; margin: 8px 0; font-size: 13px;
    display: block; overflow-x: auto; max-width: 100%;
  }
  .bubble.md th, .bubble.md td {
    border: 1px solid var(--border); padding: 4px 9px; text-align: left;
    white-space: nowrap;
  }
  .bubble.md th { background: var(--panel-2); font-weight: 600; }
  .bubble.md hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble.md a { color: var(--accent); }
  .bubble.md .md-note {
    margin-top: 8px; font-size: 12px; color: var(--warn);
  }
  .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11px; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 7px;
    font-variant-numeric: tabular-nums;
  }
  .chip.total { color: #cfe0ff; border-color: #2b4066; }
  footer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 18px;
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  input, select, textarea, button { font-family: inherit; }
  input, select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: 13px;
  }
  input { width: 90px; }
  textarea {
    width: 100%; resize: none;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; line-height: 1.5;
  }
  textarea:focus, input:focus, select:focus { outline: 1px solid var(--accent); }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row textarea { flex: 1; }
  button.primary {
    background: var(--accent); color: white; border: 0;
    border-radius: 10px; padding: 10px 18px; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  button.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; font-size: 13px;
  }
  button.ghost:hover { color: var(--text); }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .presets button {
    background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .presets button:hover { color: var(--text); border-color: #3a4150; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .error { color: #ff6b6b; }
  .gate {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
    justify-content: center; background: rgba(7, 9, 13, .85); padding: 20px;
  }
  .gate[hidden] { display: none; }
  .gateCard {
    width: min(400px, 100%); background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; display: grid; gap: 10px;
  }
  .gateCard h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .gateCard p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .gateCard input { width: 100%; }
  .gateCard button.primary { width: 100%; }
  .gateErr { color: #ff6b6b; font-size: 12px; min-height: 16px; }
  [hidden] { display: none !important; }
  .layout { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .sessionBar {
    width: 260px; flex: 0 0 260px; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  .sessionHead {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 12px 12px 10px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted); letter-spacing: .02em;
  }
  .sessionHead button { padding: 4px 9px; font-size: 12px; }
  .sessionList {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 8px; display: flex; flex-direction: column; gap: 4px;
  }
  .sessionItem {
    display: flex; align-items: stretch; gap: 4px;
    border: 1px solid transparent; border-radius: 8px;
  }
  .sessionItem.active { background: var(--panel-2); border-color: #2b4066; }
  .sessionOpen {
    flex: 1; min-width: 0; text-align: left; cursor: pointer;
    background: transparent; color: var(--text); border: 0;
    border-radius: 7px; padding: 8px 9px;
  }
  .sessionOpen:hover { background: var(--panel-2); }
  .sessionTitle {
    display: block; font-size: 13px; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sessionMeta {
    display: block; margin-top: 3px; font-size: 11px;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .sessionDel {
    flex: 0 0 28px; background: transparent; border: 0; cursor: pointer;
    color: var(--muted); font-size: 15px; line-height: 1; border-radius: 7px;
  }
  .sessionDel:hover { color: #ff6b6b; background: var(--panel-2); }
  .sessionEmpty { padding: 16px 14px; font-size: 12px; color: var(--muted); }
  .sessionMask {
    position: fixed; inset: 0; z-index: 39; background: rgba(7, 9, 13, .55);
  }
  #sessionToggle { display: none; }
  @media (max-width: 860px) {
    #sessionToggle { display: inline-block; }
    .sessionBar {
      position: fixed; z-index: 40; top: 0; bottom: 0; left: 0;
      width: min(300px, 86vw); flex-basis: auto;
      transform: translateX(-100%); transition: transform .18s ease;
      box-shadow: 0 0 30px rgba(0, 0, 0, .5);
    }
    .sessionBar.open { transform: none; }
  }
  @media (min-width: 861px) {
    .sessionMask { display: none !important; }
  }
  .sources { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .sources summary { cursor: pointer; color: var(--accent); outline: none; }
  .sources ul { margin: 8px 0 0; padding-left: 16px; }
  .sources li { margin: 8px 0; }
  .srcpath { color: var(--text); }
  .snippet { color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .bubble.streaming::after { content: "▍"; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <button class="ghost" id="sessionToggle" type="button" aria-expanded="false" hidden
          title="会话" data-i18n-title="sessions.title"
          aria-label="会话" data-i18n-aria-label="sessions.title">☰</button>
  <h1 data-i18n="page.chatTitle">企业知识库 Agent · 测试台</h1>
  <span class="badge"><span data-i18n="common.store">向量库</span> <b id="store">-</b></span>
  <span class="badge"><span data-i18n="common.model">模型</span> <b id="model">-</b></span>
  <select id="lang" aria-label="Language" data-i18n-aria-label="common.language" title="Language" data-i18n-title="common.language">
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
</header>

<div class="layout" id="layout">
  <aside class="sessionBar" id="sessionBar" hidden>
    <div class="sessionHead">
      <span data-i18n="sessions.title">会话</span>
      <button class="ghost" id="newSession" type="button" data-i18n="sessions.new">新对话</button>
    </div>
    <div class="sessionList" id="sessionList"></div>
    <div class="sessionEmpty" id="sessionEmpty" data-i18n="sessions.empty" hidden></div>
  </aside>
  <div class="sessionMask" id="sessionMask" hidden></div>

  <div class="pane">
    <main id="chat">
      <div class="msg bot">
        <div class="avatar">AI</div>
        <div class="bubble" data-i18n="chat.greeting">选择一个部门后提问。不同部门只能检索到各自授权范围内的文档。</div>
      </div>
    </main>

    <footer>
  <div class="controls">
    <label id="uidLabel"><span data-i18n="chat.user">用户</span> <input id="uid" value="u1" /></label>
    <label id="deptLabel"><span data-i18n="chat.dept">部门</span>
      <select id="dept">
        <option>Tech</option>
        <option>HR</option>
        <option>Finance</option>
        <option>Demo</option>
      </select>
    </label>
    <button class="ghost" id="newchat" title="在新标签页打开一个全新会话" data-i18n-title="chat.newChatTitle" data-i18n="chat.newChat">新对话（新窗口）</button>
    <button class="ghost" id="reset" data-i18n="chat.clear">清空当前</button>
    <button class="ghost" id="logout" hidden data-i18n="auth.logout">退出登录</button>
  </div>

  <div class="row">
    <textarea id="input" rows="2" placeholder="输入问题，Enter 发送 / Shift+Enter 换行" data-i18n-placeholder="chat.inputPlaceholder"></textarea>
    <button class="primary" id="send" data-i18n="chat.send">发送</button>
    <button class="ghost" id="stop" hidden data-i18n="chat.stop">停止</button>
  </div>

  <div class="presets">
    <button data-q="What are the code review requirements?" data-i18n="chat.preset.codeReview">代码评审要求</button>
    <button data-q="How many days of annual leave do I get and when do they expire?" data-i18n="chat.preset.annualLeave">年假与过期</button>
    <button data-q="What is the total 2026 operating budget?" data-i18n="chat.preset.budget">2026 预算</button>
    <button data-q="My laptop is broken and I need a replacement." data-i18n="chat.preset.ticket">报修/工单</button>
    <button data-q="What are the salary bands in the 2026 budget?" data-i18n="chat.preset.salary">越权测试（薪资）</button>
    <button data-q="How do I request VPN access?" data-dept="Demo" data-i18n="chat.preset.demoVpn">Demo VPN（多格式）</button>
    <button data-q="What is the test coverage metric?" data-dept="Demo" data-i18n="chat.preset.demoMetric">Demo 指标（Excel）</button>
  </div>
  <div class="hint"><span data-i18n="chat.hint">多轮对话会出现在左侧会话列表；时间单位为毫秒。</span><a href="/admin" target="_blank" style="color:var(--accent);margin-left:8px" data-i18n="chat.adminLink">入库管理</a></div>
    </footer>
  </div>
</div>

<div class="gate" id="gate" hidden>
  <form class="gateCard" id="loginForm">
    <h2 data-i18n="auth.title">登录知识库</h2>
    <p id="gateHint" data-i18n="auth.hint">
      使用账号密码登录；部门与权限由账号决定，无需手工填写。
    </p>
    <input id="username" type="text" placeholder="用户名" data-i18n-placeholder="auth.username" autocomplete="username">
    <input id="password" type="password" placeholder="密码" data-i18n-placeholder="auth.password" autocomplete="current-password">
    <details id="tokenFallback">
      <summary data-i18n="auth.tokenSummary">使用 Bearer token 登录</summary>
      <input id="credential" type="password" placeholder="粘贴 token" data-i18n-placeholder="auth.tokenPlaceholder" autocomplete="off">
    </details>
    <div class="gateErr" id="gateErr"></div>
    <button type="submit" class="primary" id="loginBtn" data-i18n="auth.login">登录</button>
  </form>
</div>

<!-- Shared zh/en dictionary; key parity is asserted by tests/test_i18n_js.py. -->
<script src="/ui/i18n.js"></script>
<!-- Safe markdown renderer + escaping helpers (also unit-tested from CI). -->
<script src="/ui/markdown.js"></script>
<!-- Request-body helpers for server-side sessions (unit-tested from CI). -->
<script src="/ui/sessions.js"></script>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const resetBtn = document.getElementById("reset");
const deptSel = document.getElementById("dept");
const uidInput = document.getElementById("uid");
const stopBtn = document.getElementById("stop");
const sessionBar = document.getElementById("sessionBar");
const sessionListEl = document.getElementById("sessionList");
const sessionEmpty = document.getElementById("sessionEmpty");
const newSessionBtn = document.getElementById("newSession");
const sessionToggle = document.getElementById("sessionToggle");
const sessionMask = document.getElementById("sessionMask");
const t = window.i18n.t;

let history = [];
let busy = false;
let abortController = null;
let sessionsEnabled = false;
let sessionId = "";
let sessionsCache = [];

// --- authentication --------------------------------------------------------
// AUTH_MODE=none: the identity fields stay visible and are sent in the body.
// AUTH_MODE=jwt: the server ignores them and only trusts the bearer token, so
// they are hidden and a login gate is shown instead.
const TOKEN_KEY = "chatToken";
const BEARER_KEY = "chatBearer";
let token = sessionStorage.getItem(TOKEN_KEY) || "";
let bearer = sessionStorage.getItem(BEARER_KEY) || "";
let authMode = "none";
let localLogin = false;

function hasCredential() {
  return Boolean(bearer || token);
}

function authHeaders(extra) {
  const headers = Object.assign({}, extra || {});
  if (bearer) headers["Authorization"] = "Bearer " + bearer;
  if (token) headers["X-API-Key"] = token;
  return headers;
}

function clearCredential() {
  bearer = "";
  token = "";
  sessionStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(BEARER_KEY);
}

function showGate(message) {
  const gate = document.getElementById("gate");
  if (!gate) return;
  gate.hidden = false;
  if (message) document.getElementById("gateErr").textContent = message;
}

function hideGate() {
  const gate = document.getElementById("gate");
  if (gate) gate.hidden = true;
}

// The OIDC callback lands on a page with #token=<jwt>; keep it and strip the
// fragment so it is not left in the address bar or a shared link.
function consumeTokenFragment() {
  const hash = location.hash || "";
  if (!hash.startsWith("#token=")) return "";
  let value = "";
  try {
    value = decodeURIComponent(hash.slice("#token=".length));
  } catch (error) {
    value = "";
  }
  // NB: `history` below is the chat transcript, so use window.history here.
  window.history.replaceState(null, "", location.pathname + location.search);
  if (!value) return "";
  bearer = value;
  token = "";
  sessionStorage.setItem(TOKEN_KEY, token);
  sessionStorage.setItem(BEARER_KEY, bearer);
  return value;
}

// Keep in sync with the backend's HISTORY_MAX_MESSAGES (default 20).
const HISTORY_MAX_MESSAGES = 20;

// Only the most recent messages are sent, starting at a user turn. This keeps
// long conversations working instead of hitting the request size limit.
function recentHistory() {
  const kept = history.slice(-HISTORY_MAX_MESSAGES);
  while (kept.length && kept[0].role !== "user") kept.shift();
  return kept;
}

// --- session persistence ---------------------------------------------------
const SESSION_KEY = "agent-rag-session-v1";
const SERVER_SESSION_KEY = "agent-rag-server-session-v1";

function saveSession() {
  try {
    localStorage.setItem(
      SESSION_KEY,
      JSON.stringify({
        history: recentHistory(),
        dept: deptSel.value,
        uid: uidInput.value,
        transcript: Array.from(chat.children)
          .filter((el) => el.dataset.persist !== "0")
          .map((el) => el.outerHTML),
      })
    );
  } catch (e) {
    /* private mode / quota: persistence is best-effort */
  }
}

function loadSession() {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
  } catch (e) {
    saved = null;
  }
  if (!saved || !Array.isArray(saved.history)) return;
  history = saved.history;
  if (saved.dept && [...deptSel.options].some((o) => o.value === saved.dept)) {
    deptSel.value = saved.dept;
  }
  if (saved.uid) uidInput.value = saved.uid;
  if (Array.isArray(saved.transcript)) {
    for (const html of saved.transcript) chat.insertAdjacentHTML("beforeend", html);
  }
  // Saved transcripts may have been recorded in another language.
  window.i18n.translateDom(chat);
  chat.scrollTop = chat.scrollHeight;
}

function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

// --- server-side sessions --------------------------------------------------
function currentUserId() {
  return uidInput.value.trim() || "u1";
}

function saveActiveSession() {
  try {
    localStorage.setItem(
      SERVER_SESSION_KEY,
      JSON.stringify({ sessionId, uid: currentUserId(), dept: deptSel.value })
    );
  } catch (e) {
    /* private mode: the server still owns this tab's transcript */
  }
}

function savedActiveSession() {
  try {
    return JSON.parse(localStorage.getItem(SERVER_SESSION_KEY) || "null");
  } catch (e) {
    return null;
  }
}

function clearActiveSession() {
  sessionId = "";
  try { localStorage.removeItem(SERVER_SESSION_KEY); } catch (e) {}
}

function setSidebar(open) {
  if (!sessionBar) return;
  sessionBar.classList.toggle("open", open);
  if (sessionMask) sessionMask.hidden = !open;
  if (sessionToggle) sessionToggle.setAttribute("aria-expanded", open ? "true" : "false");
}

function closeSidebar() {
  setSidebar(false);
}

function addDegradedNote(bubble) {
  const warn = document.createElement("div");
  warn.className = "md-note";
  warn.dataset.i18n = "chat.degradedNote";
  warn.textContent = t("chat.degradedNote");
  bubble.appendChild(warn);
}

function renderSessions() {
  if (!sessionListEl) return;
  sessionListEl.textContent = "";
  if (sessionEmpty) sessionEmpty.hidden = sessionsCache.length > 0;
  const lang = window.i18n.currentLanguage();
  for (const item of sessionsCache) {
    const row = document.createElement("div");
    row.className = "sessionItem" + (item.session_id === sessionId ? " active" : "");

    const open = document.createElement("button");
    open.type = "button";
    open.className = "sessionOpen";
    const title = document.createElement("span");
    title.className = "sessionTitle";
    title.textContent = item.title || t("sessions.untitled");
    const meta = document.createElement("span");
    meta.className = "sessionMeta";
    const count = t("sessions.messages", { count: item.message_count || 0 });
    const date = ChatSessions.formatDate(item.updated_at, lang);
    meta.textContent = date ? count + " · " + date : count;
    open.append(title, meta);
    open.title = item.title || t("sessions.untitled");
    open.onclick = () => openSession(item.session_id);

    const del = document.createElement("button");
    del.type = "button";
    del.className = "sessionDel";
    del.textContent = "×";
    del.title = t("sessions.delete");
    del.setAttribute("aria-label", t("sessions.delete"));
    del.onclick = (event) => {
      event.stopPropagation();
      deleteServerSession(item.session_id);
    };

    row.append(open, del);
    sessionListEl.appendChild(row);
  }
}

async function refreshSessions() {
  if (!sessionsEnabled) return;
  try {
    const res = await fetch("/sessions?" + ChatSessions.sessionQuery(currentUserId()), {
      headers: authHeaders(),
    });
    if (!res.ok) return;
    const data = await res.json();
    sessionsCache = Array.isArray(data.sessions) ? data.sessions : [];
    renderSessions();
  } catch (error) {
    /* keep the previous list; the chat still works */
  }
}

async function createServerSession() {
  if (!sessionsEnabled) return "";
  if (sessionId) return sessionId;
  try {
    const res = await fetch("/sessions", {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ user_id: currentUserId(), dept: deptSel.value }),
    });
    if (!res.ok) return "";
    const data = await res.json();
    if (!data.session_id) return "";
    sessionId = data.session_id;
    saveActiveSession();
    refreshSessions();
    return sessionId;
  } catch (error) {
    return "";
  }
}

async function openSession(id, options) {
  if (!sessionsEnabled || busy) return;
  try {
    const res = await fetch(
      "/sessions/" + encodeURIComponent(id) + "?" + ChatSessions.sessionQuery(currentUserId()),
      { headers: authHeaders() }
    );
    if (!res.ok) {
      if (res.status === 404) {
        clearActiveSession();
        sessionsCache = sessionsCache.filter((item) => item.session_id !== id);
        renderSessions();
        if (!options || !options.silent) startNewSession("sessions.missing");
      }
      return;
    }
    const data = await res.json();
    sessionId = data.session_id || id;
    saveActiveSession();
    if (data.dept) {
      if (![...deptSel.options].some((option) => option.value === data.dept)) {
        const option = document.createElement("option");
        option.value = data.dept;
        option.textContent = data.dept;
        deptSel.appendChild(option);
      }
      deptSel.value = data.dept;
    }
    history = [];
    chat.textContent = "";
    const messages = Array.isArray(data.messages) ? data.messages : [];
    for (const message of messages) {
      history.push({ role: message.role, content: message.content || "" });
      if (message.role === "user") {
        addMsg("user", message.content || "");
        continue;
      }
      const bubble = addMsg("bot", "");
      if (message.content) setMarkdown(bubble, message.content);
      if (message.degraded) addDegradedNote(bubble);
      attachSources(bubble, message.sources);
      addCopy(bubble, message.content || "");
    }
    if (!messages.length) addMsg("bot", "", null, false, "chat.greeting");
    renderSessions();
    closeSidebar();
    chat.scrollTop = chat.scrollHeight;
  } catch (error) {
    addMsg("bot", "", null, true, "sessions.loadFailed", { error: error.message });
  }
}

async function deleteServerSession(id) {
  if (!sessionsEnabled || busy) return;
  if (typeof window.confirm === "function" && !window.confirm(t("sessions.deleteConfirm"))) return;
  try {
    const res = await fetch(
      "/sessions/" + encodeURIComponent(id) + "?" + ChatSessions.sessionQuery(currentUserId()),
      { method: "DELETE", headers: authHeaders() }
    );
    if (!res.ok) {
      addMsg("bot", "", null, true, "sessions.deleteFailed");
      return;
    }
    sessionsCache = sessionsCache.filter((item) => item.session_id !== id);
    if (sessionId === id) startNewSession("sessions.deleted");
    renderSessions();
  } catch (error) {
    addMsg("bot", "", null, true, "sessions.deleteFailed");
  }
}

function addPosition(path, key, name, value) {
  const span = document.createElement("span");
  span.dataset.i18n = key;
  span.dataset.i18nVars = JSON.stringify({ [name]: value });
  span.textContent = t(key, { [name]: value });
  path.appendChild(span);
}

function attachSources(bubble, sources) {
  if (!sources || !sources.length) return;
  const box = document.createElement("details");
  box.className = "sources";

  const summary = document.createElement("summary");
  summary.dataset.i18n = "chat.sources";
  summary.dataset.i18nVars = JSON.stringify({ count: sources.length });
  summary.textContent = t("chat.sources", { count: sources.length });
  box.appendChild(summary);

  const list = document.createElement("ul");
  for (const src of sources) {
    const item = document.createElement("li");

    const path = document.createElement("div");
    path.className = "srcpath";

    const name = document.createElement("span");
    name.textContent = src.source || t("chat.unknownSource");
    if (!src.source) name.dataset.i18n = "chat.unknownSource";
    path.appendChild(name);

    if (src.page !== undefined) addPosition(path, "chat.page", "page", src.page);
    else if (src.slide !== undefined) addPosition(path, "chat.slide", "slide", src.slide);
    else if (src.sheet) addPosition(path, "chat.sheet", "sheet", src.sheet);

    if (typeof src.score === "number") {
      const score = document.createElement("span");
      score.textContent = ` · ${src.score.toFixed(2)}`;
      path.appendChild(score);
    }

    const parts = [];
    if (src.dept) parts.push(t("chat.sourceDept", { dept: src.dept }));
    if (src.kind) parts.push(t("chat.sourceKind", { kind: src.kind }));
    if (src.title) parts.push(src.title);
    if (typeof src.score === "number") parts.push(t("chat.sourceScore"));
    path.title = parts.join("\n");
    item.appendChild(path);

    if (src.snippet) {
      const snippet = document.createElement("div");
      snippet.className = "snippet";
      snippet.textContent = src.snippet;
      item.appendChild(snippet);
    }
    list.appendChild(item);
  }
  box.appendChild(list);
  bubble.appendChild(box);
}

function addCopy(bubble, text) {
  const button = document.createElement("button");
  button.className = "ghost";
  button.style.marginLeft = "10px";
  button.dataset.i18n = "chat.copy";
  button.textContent = t("chat.copy");
  button.onclick = async () => {
    try {
      await navigator.clipboard.writeText(text);
      button.dataset.i18n = "chat.copied";
      button.textContent = t("chat.copied");
      setTimeout(() => {
        button.dataset.i18n = "chat.copy";
        button.textContent = t("chat.copy");
      }, 1200);
    } catch (e) {
      button.dataset.i18n = "chat.copyFailed";
      button.textContent = t("chat.copyFailed");
    }
  };
  bubble.appendChild(button);
}

function addRetry(bubble, text) {
  const retry = document.createElement("button");
  retry.className = "ghost";
  retry.style.marginLeft = "10px";
  retry.dataset.i18n = "chat.retry";
  retry.textContent = t("chat.retry");
  retry.onclick = () => {
    retry.remove();
    bubble.classList.remove("error");
    bubble.textContent = "";
    input.value = text;
    send();
  };
  bubble.appendChild(retry);
}

function errorMessage(code) {
  if (code === "upstream_unavailable") return t("chat.error.upstream");
  if (code === "maintenance" || code === "index rebuilding") return t("chat.error.maintenance");
  if (code === "vector_store_unavailable") return t("chat.error.vectorStore");
  return t("chat.error.internal");
}

function attachTimings(bubble, timings) {
  if (!timings) return;
  const meta = document.createElement("div");
  meta.className = "meta";
  const order = [
    ["total_ms", "chat.timing.total"],
    ["retrieval_ms", "chat.timing.retrieval"],
    ["rerank_ms", "chat.timing.rerank"],
    ["llm_ms", "chat.timing.llm"],
    ["overhead_ms", "chat.timing.overhead"],
  ];
  const addChip = (key, vars, extraClass) => {
    const chip = document.createElement("span");
    chip.className = "chip" + (extraClass ? " " + extraClass : "");
    chip.dataset.i18n = key;
    if (vars) chip.dataset.i18nVars = JSON.stringify(vars);
    chip.textContent = t(key, vars);
    meta.appendChild(chip);
  };
  for (const [key, label] of order) {
    if (timings[key] !== undefined && !(key === "rerank_ms" && !timings[key])) {
      addChip(label, { value: timings[key] }, key === "total_ms" ? "total" : "");
    }
  }
  if (timings.llm_calls !== undefined) {
    addChip("chat.llmCalls", { count: timings.llm_calls });
  }
  if (timings.retrieval_calls !== undefined) {
    addChip("chat.retrievalCalls", { count: timings.retrieval_calls });
  }
  if (timings.cached) addChip("chat.cached", null, "total");
  if (timings.degraded) addChip("chat.degraded", null, "total");
  bubble.appendChild(meta);
}

function addMsg(role, text, timings, isError, i18nKey, i18nVars) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "bot");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "U" : "AI";

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (isError ? " error" : "");
  if (i18nKey) {
    const span = document.createElement("span");
    span.dataset.i18n = i18nKey;
    if (i18nVars) span.dataset.i18nVars = JSON.stringify(i18nVars);
    span.textContent = t(i18nKey, i18nVars);
    bubble.appendChild(span);
  } else {
    bubble.textContent = text;
  }

  if (timings) attachTimings(bubble, timings);

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  if (text.length > 4000) {
    addMsg("bot", "", null, true, "chat.tooLong");
    return;
  }

  busy = true;
  sendBtn.disabled = true;
  stopBtn.hidden = false;
  input.value = "";
  addMsg("user", text);

  const bubble = addMsg("bot", "", null, false, "chat.thinking");
  bubble.classList.add("streaming");
  const started = performance.now();
  let answer = "";
  let timings = null;
  let sources = [];
  let degraded = false;

  abortController = new AbortController();
  try {
    // Server-side sessions: create one lazily on the first turn. If creation
    // fails, buildChatBody falls back to the bounded local history.
    const activeSession = await createServerSession();
    const resp = await fetch("/chat/stream", {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      signal: abortController.signal,
      body: JSON.stringify(
        ChatSessions.buildChatBody({
          userId: currentUserId(),
          dept: deptSel.value,
          message: text,
          sessionId: activeSession,
          history: recentHistory(),
          maxHistory: HISTORY_MAX_MESSAGES,
        })
      ),
    });

    if (!resp.ok) {
      let detail = resp.status;
      try { detail = (await resp.json()).detail || detail; } catch (e) {}
      bubble.classList.remove("streaming");
      bubble.classList.add("error");
      bubble.classList.remove("md");
      if (resp.status === 401) {
        // The token expired or the account was disabled: back to the gate.
        clearCredential();
        showGate(t("auth.expired"));
      }
      const code = typeof detail === "object" && detail ? detail.error : null;
      if (resp.status === 503 || code === "maintenance") {
        bubble.textContent = errorMessage(code || "upstream_unavailable", detail && detail.request_id);
        addRetry(bubble, text);
      } else if (resp.status === 400) {
        bubble.textContent =
          code === "missing_department"
            ? t("chat.error.missingDepartment")
            : t("chat.error.invalidDepartment");
      } else if (resp.status === 422) {
        bubble.textContent = t("chat.error.tooManyMessages");
      } else if (resp.status === 429) {
        bubble.textContent = t("chat.error.rateLimited");
      } else if (resp.status === 413) {
        bubble.textContent = t("chat.error.payloadTooLarge");
      } else {
        bubble.textContent = t("chat.error.requestFailed", {
          detail: typeof detail === "object" ? JSON.stringify(detail) : detail,
        });
      }
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let firstToken = true;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (!raw.startsWith("data: ")) continue;

        let ev;
        try { ev = JSON.parse(raw.slice(6)); } catch (e) { continue; }

        if (ev.type === "token") {
          if (firstToken) {
            firstToken = false;
            bubble.textContent = "";
          }
          answer += ev.content;
          bubble.textContent = answer;
          chat.scrollTop = chat.scrollHeight;
        } else if (ev.type === "done") {
          timings = ev.timings;
          if (ev.sources) sources = ev.sources;
          if (ev.degraded) degraded = true;
          if (ev.session_id) {
            sessionId = ev.session_id;
            saveActiveSession();
          }
        } else if (ev.type === "error") {
          bubble.classList.remove("streaming");
          bubble.classList.add("error");
          bubble.textContent = errorMessage(ev.code, ev.request_id) + " request_id=" + ev.request_id;
          if (["upstream_unavailable", "maintenance", "vector_store_unavailable"].includes(ev.code)) {
            addRetry(bubble, text);
          }
        }
      }
    }

    bubble.classList.remove("streaming");
    if (answer) {
      // Render the finished reply as markdown; streaming stays plain text so
      // a partially-typed table never flickers into a broken layout. An error
      // event aborts the reply, so keep its plain message in that case.
      if (bubble.classList.contains("error")) {
        bubble.textContent = answer;
      } else {
        setMarkdown(bubble, answer);
      }
      if (degraded) addDegradedNote(bubble);
      attachSources(bubble, sources);
      attachTimings(bubble, timings);
      addCopy(bubble, answer);
      history.push({ role: "user", content: text });
      history.push({ role: "assistant", content: answer });
      if (sessionsEnabled) {
        saveActiveSession();
        refreshSessions();
      } else {
        saveSession();
      }
    } else if (!bubble.classList.contains("error")) {
      bubble.textContent = t("chat.empty");
    }
  } catch (e) {
    bubble.classList.remove("streaming");
    bubble.classList.remove("md");
    if (e.name === "AbortError") {
      bubble.classList.add("error");
      bubble.textContent = answer
        ? t("chat.stoppedWithAnswer", { answer })
        : t("chat.stopped");
    } else {
      bubble.classList.add("error");
      bubble.textContent = t("chat.networkError", { error: e.message });
    }
  } finally {
    busy = false;
    sendBtn.disabled = false;
    stopBtn.hidden = true;
    abortController = null;
    input.focus();
  }
}

sendBtn.onclick = send;
stopBtn.onclick = () => {
  if (abortController) abortController.abort();
};
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// Switching department or user must not carry the previous context over:
// answers from another department would otherwise leak into this conversation.
function startNewSession(key, vars) {
  history = [];
  clearActiveSession();
  clearSession();
  chat.innerHTML = "";
  addMsg("bot", "", null, false, key, vars);
  if (sessionsEnabled) renderSessions();
  input.focus();
}

deptSel.addEventListener("change", () => {
  startNewSession("chat.switchedDept", { dept: deptSel.value });
});
uidInput.addEventListener("change", () => {
  startNewSession("chat.switchedUser", { user: uidInput.value || "u1" });
  refreshSessions();
});

const newChatBtn = document.getElementById("newchat");

newSessionBtn.onclick = () => {
  startNewSession("sessions.started");
  closeSidebar();
};
sessionToggle.onclick = () => setSidebar(!sessionBar.classList.contains("open"));
sessionMask.onclick = closeSidebar;
document.addEventListener("i18n:change", () => {
  if (sessionsEnabled) renderSessions();
});

// Open a brand-new session in a separate tab; the current conversation stays intact.
newChatBtn.onclick = () => {
  window.open(`${location.pathname}?new=${Date.now()}`, "_blank", "noopener");
};

// Explicitly clear this tab's conversation.
resetBtn.onclick = () => {
  startNewSession("chat.cleared");
};

document.querySelectorAll(".presets button").forEach(b => {
  b.onclick = () => {
    if (b.dataset.dept && deptSel.value !== b.dataset.dept) {
      deptSel.value = b.dataset.dept;
      deptSel.dispatchEvent(new Event("change"));
    }
    input.value = b.dataset.q;
    input.focus();
  };
});

// --- login -----------------------------------------------------------------

async function passwordLogin(username, password) {
  const res = await fetch("/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password }),
  });
  if (!res.ok) {
    document.getElementById("gateErr").textContent =
      res.status === 429 ? t("auth.tooMany") : t("auth.badCredentials");
    return false;
  }
  const data = await res.json();
  if (!data.token) return false;
  bearer = data.token;
  token = "";
  sessionStorage.setItem(TOKEN_KEY, token);
  sessionStorage.setItem(BEARER_KEY, bearer);
  document.getElementById("password").value = "";
  if (data.user && data.user.username) uidInput.value = data.user.username;
  if (data.user && data.user.depts && data.user.depts.length) {
    const dept = data.user.depts[0];
    if (![...deptSel.options].some((o) => o.value === dept)) {
      const option = document.createElement("option");
      option.value = dept;
      option.textContent = dept;
      deptSel.appendChild(option);
    }
    deptSel.value = dept;
  }
  return true;
}

// Who are we? In jwt mode the answer decides whether the gate is shown.
async function resolveAuth() {
  const fields = [document.getElementById("uidLabel"), document.getElementById("deptLabel")];
  if (authMode !== "jwt") {
    fields.forEach((el) => { if (el) el.hidden = false; });
    hideGate();
    return true;
  }
  fields.forEach((el) => { if (el) el.hidden = true; });
  const logout = document.getElementById("logout");
  if (logout) logout.hidden = false;
  if (!hasCredential()) {
    showGate();
    return false;
  }
  try {
    const res = await fetch("/admin/api/session", { headers: authHeaders() });
    if (!res.ok) {
      clearCredential();
      showGate(t("auth.expired"));
      return false;
    }
    const info = await res.json();
    if (info.user_id) uidInput.value = info.user_id;
    if (info.depts && info.depts.length) {
      const dept = info.depts[0];
      if (![...deptSel.options].some((o) => o.value === dept)) {
        const option = document.createElement("option");
        option.value = dept;
        option.textContent = dept;
        deptSel.appendChild(option);
      }
      deptSel.value = dept;
    }
    hideGate();
    return true;
  } catch (error) {
    showGate(t("auth.unreachable", { error: error.message }));
    return false;
  }
}

document.getElementById("loginForm").onsubmit = async (event) => {
  event.preventDefault();
  document.getElementById("gateErr").textContent = "";
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const pasted = document.getElementById("credential").value.trim();
  if (pasted) {
    bearer = pasted;
    token = "";
    sessionStorage.setItem(TOKEN_KEY, token);
    sessionStorage.setItem(BEARER_KEY, bearer);
    document.getElementById("credential").value = "";
  } else if (username && password) {
    if (!(await passwordLogin(username, password))) return;
  } else {
    document.getElementById("gateErr").textContent = t("auth.enterCredentials");
    return;
  }
  if (!(await resolveAuth())) return;
  startNewSession("auth.signedInNew");
  refreshSessions();
};

document.getElementById("logout").onclick = () => {
  clearCredential();
  sessionsCache = [];
  startNewSession("auth.signedOut");
  showGate();
};

(async function boot() {
  const fromSso = consumeTokenFragment();
  const store = document.getElementById("store");
  const model = document.getElementById("model");
  try {
    const info = await fetch("/info").then((r) => r.json());
    authMode = info.auth_mode || "none";
    localLogin = Boolean(info.local_login);
    sessionsEnabled = Boolean(info.sessions_enabled);
    store.textContent = info.vector_store || "-";
    model.textContent = info.llm_model || "-";
  } catch (error) {
    // Keep working in "none" mode if /info is unreachable.
  }
  if (authMode === "jwt" && !localLogin) {
    // No account store: only a pasted token can log in.
    document.getElementById("username").hidden = true;
    document.getElementById("password").hidden = true;
    document.getElementById("tokenFallback").open = true;
  }
  if (authMode === "jwt") document.getElementById("tokenFallback").open = !localLogin;
  const authed = await resolveAuth();
  if (authed) {
    const freshView = Boolean(new URLSearchParams(location.search).get("new"));
    if (sessionsEnabled) {
      sessionBar.hidden = false;
      sessionToggle.hidden = false;
      if (freshView) clearActiveSession();
      await refreshSessions();
      // Reopen this tab's last server session; a deleted one falls back to the
      // greeting without showing an error during boot.
      const saved = freshView ? null : savedActiveSession();
      if (saved && saved.sessionId && saved.uid === currentUserId()) {
        await openSession(saved.sessionId, { silent: true });
      }
    } else if (!freshView) {
      // Older servers (or SESSIONS_ENABLED=false) keep the localStorage transcript.
      loadSession();
    }
  } else if (fromSso) {
    showGate(t("auth.invalidSso"));
  }
})();
