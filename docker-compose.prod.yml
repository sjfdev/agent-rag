# Production stack: etcd + Milvus + the application.
#
#   cp .env.example .env        # set LLM_*, ADMIN_TOKEN, CHAT_API_KEY, ...
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec app python run_ingestion.py
#
# The application is only reachable through the published port below; put it
# behind a reverse proxy (Caddy/Nginx) with TLS for real deployments.
name: agent-rag-prod

services:
  etcd:
    container_name: agent-rag-etcd
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.5}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes-prod/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: agent-rag-milvus
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.5.4}
    restart: unless-stopped
    mem_limit: 5g
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
      LOCALSTORAGE_PATH: /var/lib/milvus/data/
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes-prod/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 120s
      timeout: 20s
      retries: 5
    depends_on:
      etcd:
        condition: service_healthy
    # 19530/9091 are intentionally not published: only `app` needs them.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  app:
    container_name: agent-rag-app
    build:
      context: .
      args:
        EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
    image: agent-rag:${APP_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-to-container networking; overrides .env values above.
      VECTOR_STORE_TYPE: milvus
      MILVUS_URI: http://milvus:19530
      DATA_DIR: /app/data
      AUDIT_LOG_PATH: /app/logs/admin_audit.log
      JOBS_PATH: /app/logs/ingest_jobs.json
      HF_HUB_OFFLINE: "1"
      # Optional ACL file mounted read-only; enable via ACL_ENABLED=true in .env.
      ACL_FILE: /app/config/acl.json
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data:/app/data
      - ${DOCKER_VOLUME_DIRECTORY:-.}/logs:/app/logs
      # Uncomment after creating config/acl.json.
      # - ./config:/app/config:ro
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      milvus:
        condition: service_healthy
    healthcheck:
      # Liveness (process up). Readiness is /health, which is 503 while the
      # index is empty; point your load balancer at /health instead.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/info', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  default:
    name: agent-rag-prod
